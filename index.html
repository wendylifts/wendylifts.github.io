<style>
:root{
  --bg:#EDF5F6; --surface:#FFFFFF; --ink:#0B2533; --muted:#587280; --line:#D0E1E5;
  --lane:#0A8FA3; --link:#076A7A; --lane-ink:#FFFFFF; --buoy:#E8472B; --deep:#0B3C5D; --soft:#E3F1F4; --ok:#1F8A5B;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#08171F;--surface:#0F2530;--ink:#E6F2F5;--muted:#8FB0BC;--line:#1D3A47;--lane:#35C2D6;--link:#35C2D6;--lane-ink:#06222A;--buoy:#FF7A59;--deep:#0B3C5D;--soft:#12303C;--ok:#4CC48C}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.top{background:var(--deep);color:#fff}
.top-in{max-width:880px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--head);font-weight:700;font-size:30px;letter-spacing:.5px;line-height:1}
.nav{display:flex;gap:4px}
.nav a{display:inline-block;color:#cfe6ee;padding:8px 10px;font-weight:600;border-bottom:3px solid transparent;border-radius:4px 4px 0 0;text-decoration:none}
.nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--buoy)}
.rope{height:10px;background:repeating-linear-gradient(90deg,var(--buoy) 0 14px,#fff 14px 28px,var(--lane) 28px 42px,#fff 42px 56px)}
main{max-width:880px;margin:0 auto;padding:16px 16px 80px}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;line-height:1.1}
h2{font-size:28px}
h3{font-size:21px}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.weekbar .ttl{display:flex;flex-direction:column}
.weekbar .sub{color:var(--muted);font-size:14px}
.stepper{display:flex;gap:6px}
.btn{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--lane)}
.btn.primary{background:var(--buoy);border-color:var(--buoy);color:#fff}
.btn.teal{background:var(--lane);border-color:var(--lane);color:var(--lane-ink)}
.btn.small{padding:5px 10px;font-size:14px;border-radius:8px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-block;background:var(--soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.hero{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.hero h2{font-size:32px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.note{color:var(--muted);font-size:14px;margin:4px 0}
.sec{margin:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h3{font-size:24px}

hex_dl|Stand inside the hex bar with your feet hip-width apart and hold the handles.;Brace your core and push the floor away to stand up straight.;Lower the bar by pushing your hips back. Reset each rep.
kb_dl|Stand with your feet wide and the kettlebell between them.;Hinge back, grab the handle, and keep your chest tall.;Push the floor apart to stand tall, then lower with control.
pullthru|Attach the rope to the low pulley, face away from the machine, and hold the rope by the knotted ends between your legs.;Hinge your hips back and let the cable pull through.;Drive your hips forward and squeeze your glutes.
kb_swing|Stand with your feet wide and the kettlebell slightly in front of you.;Hike it back between your legs, then snap your hips forward to float the bell to chest height.;Let it swing back and repeat. Your hips do the work, not your arms.
sl_rdl|Stand on one leg holding a dumbbell, with one hand on the rack for balance.;Hinge forward while the other leg reaches back.;Return by squeezing your glute. Finish all reps, then switch legs.
sl_bridge|Lie on your back with one foot flat and the other leg extended.;Press through your heel to lift your hips.;Lower slowly. Finish all reps, then switch legs.
step_up|Stand facing the low step.;Step up with one foot and stand tall, then step back down slowly.;Finish all reps, then switch legs.
hip_thrust|Sit on the floor with your upper back against the bench and a weight on your hips. For a barbell, roll it over your hips with the pad on.;Press through your heels to lift your hips until your body is flat.;Squeeze at the top, then lower slowly.
band_walk|Put a band around your thighs or ankles and stand with your knees slightly bent.;Step sideways, keeping tension on the band.;Step back the other way with your toes pointing forward.
sl_abd|Lie on your side with an ankle weight on your top leg.;Lift the top leg slightly back and up with your toes pointing forward.;Lower slowly. Finish all reps, then switch sides.
slider_curl|Lie on your back with your heels on the sliders and lift your hips.;Slide your heels away until your legs are almost straight.;Curl your heels back in, keeping your hips high.
ball_curl|Lie on your back with your heels on the ball and lift your hips.;Roll the ball away until your legs are almost straight.;Curl it back in with your heels, keeping your hips high.
trx_curl|Lie on your back with your heels in the TRX straps and lift your hips.;Extend your legs, then curl your heels toward you.;Keep your hips high the whole time.
calf|Stand on the step with the ball of one foot on the edge, holding the rack for balance.;Rise up on your toes as high as you can, pause, then lower slowly below the step.;Finish all reps, then switch legs.
flutter|Lie face down on the mat with ankle weights on.;Lift your legs slightly and kick in small fast flutters.;Keep your core tight and your neck relaxed.
cable_sq_press|Set the pulleys low and hold the handles at your shoulders, facing away from the machine.;Sit back into a comfortable squat, then stand and press the handles overhead.;Lower them back to your shoulders and repeat.
goblet_press|Hold a kettlebell or dumbbell at your chest.;Squat to a shallow depth, then stand up and press it overhead.;Lower it back to your chest and repeat.
thruster|Sit on the bench holding dumbbells at your shoulders.;Stand up and press the weights overhead in one motion.;Lower the weights and sit back down slowly.
rdl_row|Hold dumbbells in front of your thighs and hinge your hips back.;Row both dumbbells to your ribs.;Lower them, then stand up by driving your hips forward.
wall_curl|Stand with your back against a wall and slide down until your thighs are near parallel to the floor. Stay in a pain-free range.;Hold a dumbbell in each hand and curl them up while you keep the wall sit.;Lower slowly. Stand up to rest if your knees complain.
hammer_press|Stand tall holding dumbbells at your sides with your palms facing in.;Curl up with your thumbs toward the ceiling, then rotate your palms forward and press overhead.;Lower back to your sides under control.
skull|Lie on a flat bench holding a dumbbell in each hand over your chest with your palms facing in.;Bend your elbows to lower the weights toward your forehead, keeping your upper arms still.;Press back up until your arms are straight.
tri_skull|Lie on the bench with a dumbbell in each hand at your lower chest, elbows tucked.;Press up into a close-grip triceps press until your arms are straight.;Bend only your elbows and lower the weights toward your forehead, then press back up to straight arms.;Bring the weights back down to your chest to start the next rep.
cable_row_squat|Set the pulley at hip height and hold the handle with straight arms, feet shoulder-width apart.;Sit your hips back into a shallow squat, arms reaching forward.;Stand up as you pull the handle to your ribs. Stay in a pain-free squat depth.
lat_pd_floor|Attach the lat bar to the high pulley. Sit on the mat facing the machine with your knees bent or legs extended.;Reach up and hold the bar slightly wider than your shoulders.;Pull the bar to your upper chest, elbows down toward your ribs. Return slowly.
squat_walk|Stand tall. Drive one knee up, then the other, as you march forward a few steps.;Sit into a shallow, pain-free squat.;Walk backward to your start and repeat.
plank_jack|Start in a plank with your hands under your shoulders on the mat.;Step your feet out wide one at a time, then step them back together. No hopping.;Keep your hips level and your core tight.
lying_slr|Lie on your back with your legs straight and your hands under your hips.;Raise both legs to point at the ceiling.;Lower them slowly without letting your low back arch.
cable_kick|Set the pulley at hip height and hold the handle in one hand. Hinge forward with a flat back and your elbow at your side.;Straighten your arm back until it is fully extended, keeping your upper arm still.;Return slowly. Finish all reps, then switch sides.
sq_upright|Stand with your feet in squat width, holding a kettlebell or dumbbell with both hands in front of you.;Squat down, lowering the weight toward the floor with your palms facing you.;Stand up as you pull the weight to chest height with your elbows high. Lower as you squat again.
superman|Lie face down with your arms reaching forward and your legs straight.;Lift your arms, chest and legs a few inches off the floor while keeping your neck long.;Hold for a second, then lower slowly.
skier|Stand with a light dumbbell in each hand and your arms straight overhead, with a slight hinge at the hips.;Sweep both arms down in a wide arc toward your thighs, driving with your lats.;Return overhead slowly. Keep your arms straight and ribs down.
pullover|Lie on the bench with your shoulders on it and hold one dumbbell with both hands over your chest.;Lower it back behind your head with your elbows slightly bent, until you feel a lat stretch.;Pull it back over your chest using your lats.
chest_fly|Lie on the bench holding dumbbells over your chest with your palms facing each other.;Open your arms wide in an arc with soft elbows until you feel a chest stretch.;Bring the weights back together over your chest.
tri_bench|Lie on the bench holding dumbbells over your chest with your palms facing each other.;Lower them with your elbows tucked close to your ribs.;Press back up, squeezing your triceps.
db_oh_tri|Stand or sit holding one dumbbell with both hands overhead.;Bend your elbows to lower it behind your head, keeping your elbows pointed up.;Straighten your arms to press it back overhead.
db_kick|Hinge forward with a flat back, holding a dumbbell in each hand with your elbows bent beside your ribs.;Straighten both arms back until fully extended.;Return slowly without moving your upper arms.
row_kick|Hinge forward with a flat back, holding a dumbbell in each hand.;Row both weights to your ribs.;Straighten your arms back into a kickback, then lower and repeat.
curl_press|Stand holding dumbbells at your sides.;Curl them up to your shoulders.;Press them straight out in front of you at chest height, then bring them back in and lower.
rope_situp|Lie on your back with your knees bent and your arms reaching overhead.;Sit up while pulling your hands down in a hand-over-hand rope climbing motion.;Lower back down slowly and reach overhead again.
knee_crunch|Lie on your back with your hands behind your head and your legs lifted.;Curl your shoulders up as you pull your knees in toward your chest.;Lower slowly without letting your low back arch.
elbow_slp|Start in a forearm plank with your body in a straight line.;Lift one leg a few inches and hold it briefly.;Lower and switch legs. Keep your hips level.
wsitup|Lie on your back with your knees bent and a dumbbell held at your chest.;Curl up to sitting using your abs.;Lower slowly.
situp_press|Lie on your back with your knees bent, holding a light dumbbell at your chest.;Sit up and press the weight straight overhead.;Lower it to your chest and roll back down slowly.
bench_mc|Place your hands on the bench in an incline plank.;Drive one knee toward your chest, then switch quickly.;Keep your hips low and your core tight.
db_calf|Stand holding a dumbbell in each hand, feet hip-width.;Rise onto your toes as high as you can.;Pause, then lower slowly.
butterfly_bridge|Lie on your back with the soles of your feet together and your knees dropped open.;Press through the outsides of your feet to lift your hips.;Squeeze your glutes at the top, then lower slowly.
wall_oh|Slide down a wall until your thighs are near parallel, in a pain-free range.;Hold light dumbbells and raise them overhead.;Lower slowly. Stand up to rest if your knees complain.
sumo|Stand with your feet wide and your toes turned out, holding a dumbbell between your legs.;Sit your hips down with your chest tall to a pain-free depth.;Drive through your heels to stand.
goblet15|Hold a dumbbell or kettlebell at your chest and squat to a pain-free depth.;Come halfway up, then lower again.;Stand all the way up. That is one rep.
sq_curl|Hold dumbbells at your sides and squat to a pain-free depth.;Stand up as you curl the weights to your shoulders.;Lower the weights as you squat again.
rev_lunge_oh|Hold light dumbbells at your sides.;Step one foot back into a lunge in a pain-free range.;Push up to stand and raise the weights overhead. Finish one side, then switch.
plank_shift|Start in a plank on your hands with your body in a straight line.;Shift your weight slightly to one side and then the other without twisting.;Lower into a push-up and press back up. Repeat.
bench_dip|Sit on the edge of the bench with your hands beside your hips and your legs out in front.;Slide your hips off and bend your elbows to lower a few inches.;Press back up. Stop if your shoulders complain.
db21|Stand holding dumbbells and curl from the bottom to halfway, seven reps.;Curl from halfway to the top, seven reps.;Do seven full curls. That is one set of 21.
bulgarian|Stand a step in front of the bench and rest the top of your back foot on it.;Lower your back knee straight down in a pain-free range.;Drive through your front heel to stand. Finish one side, then switch.
sl_bench|Stand in front of the bench on one leg.;Sit back until you lightly touch the bench.;Stand up through your heel. Finish one side, then switch.
curtsy|Stand tall, holding a light dumbbell at your chest.;Step one foot behind and across your body into a curtsy lunge in a pain-free range.;Return to standing. Finish one side, then switch.
lunge3d|Step one foot forward into a lunge, then return.;Step it out to the side and return.;Step it back and return. That is one rep. Switch legs after each set.
stat_lunge_curl|Hold dumbbells at your sides and set up in a split stance.;Lower into a lunge in a pain-free range.;Curl the weights as you hold the lunge, then stand. Finish one side, then switch.
stat_lunge_press|Hold dumbbells at your shoulders and set up in a split stance.;Lower into a lunge in a pain-free range.;Press the weights overhead as you stand. Finish one side, then switch.
incl_curl|Sit back on an incline bench with your arms hanging and a dumbbell in each hand, palms facing in.;Curl one weight to shoulder level while turning your palm up at the top.;Lower slowly and alternate arms.
bent_kick|Get on your hands and knees on the mat, with your knees padded and your abs braced.;Lift one leg with the knee bent, squeezing your glute, until your thigh is level with your back.;Lower without letting your low back sway. Finish one side, then switch.
shrug|Stand holding a dumbbell in each hand with your arms at your sides.;Raise your shoulders straight up toward your ears as high as you can.;Pause, then lower slowly.
conc_curl|Sit on the end of the bench with your legs apart and rest one elbow on your inner thigh, letting the dumbbell hang.;Curl the weight toward your shoulder using only your biceps.;Pause at the top and lower slowly. Finish one side, then switch.
iso_curl|Hold a dumbbell in each hand and curl one arm up to 90 degrees. Keep it there.;Curl the other arm up toward your shoulder, pause, and lower.;Finish all reps with that arm while the other holds, then switch.
wrist_curl|Kneel or sit beside a bench and rest your forearms on it, palms up, with your wrists past the edge.;Lower the dumbbells as far as you can, pause, then curl them up as high as possible.;Keep your forearms still the whole time.
pendlay|Stand with your feet hip-width and the barbell over the middle of your feet. Hinge forward with a flat back and grip the bar.;Pull the bar to your lower chest, keeping your torso parallel to the floor.;Lower it to the floor, reset, and repeat.
prone_kick|Lie face down on a flat bench holding a dumbbell in each hand with your elbows bent at 90 degrees at shoulder height.;Raise the dumbbells up and back, straightening your arms.;Lower with steady shoulders and repeat.
pulse_sq|Stand with your feet shoulder-width apart and squat to a pain-free depth.;Stay low and pulse up and down a few inches.;Stand up to finish the set.
er_side|Lie on your side with your top elbow bent 90 degrees and pinned against your ribs, holding a light dumbbell.;Rotate your forearm up toward the ceiling without moving your elbow.;Lower slowly. Finish all reps, then switch sides.
side_bend|Stand tall with a dumbbell in one hand and your other hand on your waist.;Bend sideways toward the weight, then lift back up past center.;Keep your hips still. Finish all reps, then switch hands.
toe_touch|Lie on your back and point your legs straight up. Bend your knees if your hamstrings are tight.;Roll your ribs up and reach toward your toes.;Lower back down slowly.
db_bridge|Lie on your back with your knees bent and a dumbbell across your hips, held in place with your hands.;Squeeze your glutes to lift your hips until your body is a straight line.;Keep your abs on so you don't arch your low back. Lower slowly.
sl_kick|Get on your hands and knees on the mat with your knees padded and your abs braced.;Extend one leg straight back until it is level with your back.;Lower under control without letting your low back sway. Finish one side, then switch.
band_kick|Get on your hands and knees on the mat with a band around your feet or secured under one hand.;Kick one leg straight back against the band, squeezing your glute.;Return slowly. Finish one side, then switch.
loop_squat|Put the band just above your knees and stand with your feet shoulder-width apart.;Sit your hips back and down to a pain-free depth while pressing your knees out into the band.;Push through your heels to stand.
loop_walk|Put the band just above your knees and stand with your feet hip-width apart and your knees soft.;Take a step to the side, then bring the other foot in without letting the band go slack.;Take all your steps one way, then come back the other way. Each step counts as a rep.
loop_bridge|Put the band just above your knees and lie on your back with your knees bent and feet flat.;Press your knees out against the band and push through your heels to lift your hips.;Squeeze your glutes at the top, then lower slowly.
loop_clam|Put the band just above your knees and lie on your side with your knees bent and your hips stacked.;Keep your feet together and open your top knee without letting your hips roll back.;Lower slowly. Finish all reps, then switch sides.
loop_hydrant|Put the band just above your knees and get on your hands and knees on the mat.;Lift one knee out to the side, keeping your hips level and your back flat.;Lower slowly. Finish all reps, then switch sides.
drag_curl|Stand holding dumbbells at your sides.;Curl the weights up close to your body, letting your elbows travel behind you.;Lower slowly.
wn_squat|Hold dumbbells at shoulder height with your feet a little wider than normal.;Squat, then step one foot in close to the other and squat narrow.;Step back out wide and squat, then bring the other foot in. Alternate sides.
db_front_sq|Hold dumbbells at your shoulders with your elbows forward.;Sit your hips back and down to a pain-free depth with your knees tracking over your feet.;Drive through your heels to stand.
atlas|Stand holding one dumbbell with both hands at one shoulder.;Press it overhead until your arms are straight.;Lower it to the other shoulder and press again, alternating sides each rep.
band_tri_kick|Hinge forward with the band anchored under your front foot or hand, holding the other end with your elbow at your side.;Straighten your arm back until fully extended.;Return slowly. Finish all reps, then switch sides.
db_ham|Lie face down on the mat with a dumbbell held between your feet.;Curl your heels toward your hips.;Lower slowly without arching your back.
cable_glute_kick|Set the pulley low and put your shoe in the foot strap (or use the ankle cuff). Face the machine and hold the frame for balance.;Kick that leg straight back, squeezing your glute, without arching your low back.;Return slowly. Finish all reps, then switch legs.
db_decline|Set the bench to a decline and lie back holding dumbbells at your chest.;Press the weights straight up until your arms are straight.;Lower slowly and repeat.
decline_fly|Set the bench to a decline and lie back holding dumbbells over your chest with your palms facing each other.;Open your arms in a wide arc with soft elbows.;Bring the weights back together over your chest.
front_raise|Stand holding light dumbbells in front of your thighs.;Raise both arms straight in front of you to shoulder height.;Lower slowly without leaning back.
lying_ir|Lie on your side with your elbow bent 90 degrees against your ribs, holding a light dumbbell.;Rotate your forearm up across your belly.;Lower slowly. Finish all reps, then switch sides.
sl_calf|Stand on one foot holding a dumbbell in one hand and the rack with the other.;Rise onto your toes as high as you can.;Lower slowly. Finish all reps, then switch legs.
plank_pu|Start in a forearm plank.;Press up onto one hand, then the other, into a high plank.;Lower back to your forearms one arm at a time. Alternate which arm leads.
plank_row|Start in a high plank with your hands on dumbbells and your feet wide.;Row one dumbbell to your ribs without twisting.;Lower it and repeat. Finish all reps, then switch arms.
skull_bridge|Lie on your back with your knees bent and lift your hips into a bridge, holding dumbbells over your chest.;Bend your elbows to lower the weights toward your forehead.;Straighten your arms while keeping your hips high.
kb_alt_row|Start in a high plank with your hands on two kettlebells and your feet wide.;Row one kettlebell to your ribs without twisting.;Lower it and switch sides.
sl_wall_dl|Stand facing away from a wall on one leg with the other foot lightly on the wall behind you, holding a dumbbell.;Hinge forward, pressing your back foot into the wall.;Return by squeezing your glute. Finish all reps, then switch legs.
sa_ohp|Hold one dumbbell at your shoulder with your core braced.;Press it straight overhead.;Lower slowly. Finish all reps, then switch arms.
wrist_ext|Rest your forearms on a bench, palms down, wrists past the edge.;Lower the dumbbells, then raise your wrists as high as possible.;Keep your forearms still.
bb_rear_row|Hinge forward holding the bar with a wide overhand grip.;Pull the bar toward your upper chest with elbows flared wide.;Lower with control, keeping a flat back.
incl_front|Set the bench to an incline and lie face down on it holding light dumbbells.;Raise both arms forward to head level.;Lower slowly.
press_fly|Sit on the bench holding dumbbells at your shoulders and press them overhead.;Lower them and lie back, then open your arms into a chest fly.;Bring them together and sit back up. Repeat.
db_squat|Stand holding dumbbells at your sides, feet shoulder-width.;Sit your hips back and down to a comfortable depth.;Push through your heels to stand.
ball_side_plank|Prop yourself on your side with your elbow and forearm centered on top of the stability ball.;Stack or stagger your feet and lift your hips so your body forms one straight line.;Squeeze your glutes and abs and hold for the time shown, then switch sides.
ball_plank|Place your hands on the ball under your shoulders.;Walk your feet back one at a time into a high plank.;Squeeze your glutes, draw in your abs, and hold a neutral spine.
ball_tuck|Start in a push-up position with your feet or shins on the ball.;Pull the ball toward your chest by bending your knees and hips.;Roll it back out to a straight body and repeat.
ball_deadbug|Lie on your back holding the ball between your hands and knees over your hips.;Slowly extend one leg while the ball stays squeezed and your low back stays flat.;Return and switch legs.
roller_ll|Lie on your back on the mat with a foam roller by your feet.;Raise both legs straight up, then slowly lower one leg to tap the roller while the other stays up.;Return it to the top and alternate legs.
side_leg_abd|Get into a side plank on your forearm, or lie on your side if that is too hard.;Lift your top leg as high as you can, leading with the heel.;Lower slowly. Finish all reps, then switch sides.
ball_jack|Start in a push-up position with your shins on the ball and a straight line from head to ankles.;Without rounding your low back, pull the ball toward your chest by bending your knees.;Pause, then roll back to the start.
ball_pike|Start in a push-up position with your shins on the ball and a straight line from head to ankles.;Keeping your legs straight, lift your hips up toward the ceiling so the ball rolls toward your feet.;Pause, then lower your hips and roll the ball back to the start. Bend your knees to make it easier.
swim_kick|Lie face down with your arms reaching forward and your legs straight.;Lift your arms, chest and legs slightly off the floor and keep your neck long.;Kick your legs up and down in small, fast flutters for the whole time. Rest if your low back complains.
v_twist|Sit with your knees bent and your feet low, lean back slightly, and hold your hands together at your chest.;Keep your chest tall and rotate your ribs to one side.;Rotate to the other side. One rep is one twist to the left or right.
plank_dip|Get into a forearm plank with your feet hip-width apart and your body in a straight line.;Slowly rotate your hips to drop them toward one side.;Return to the middle, then dip to the other side. Keep your abs braced.
dead_bug_db|Lie on your back holding a light dumbbell straight up over your chest with both hands, and your knees bent over your hips.;Lower the opposite arm and leg while your low back stays flat.;Return and switch sides. One rep is a right and a left.
stir_pot|Get into a forearm plank with your forearms on the stability ball and your feet wide.;Draw small slow circles with your elbows, one way for half the time.;Switch directions. Keep your hips level and your abs braced.
ball_pass|Lie on your back holding the ball overhead with your legs straight.;Raise your arms and legs to meet over your hips and pass the ball into your feet.;Lower your arms and legs without touching the floor, then pass the ball back to your hands. Keep your low back down.
pallof_hold|Set a pulley at chest height and stand sideways, holding the handle at your chest.;Press the handle straight out and hold it with your arms extended.;Resist the pull without letting your body twist. Finish the time, then switch sides.
kb_windmill|Hold a kettlebell overhead in one hand with a straight arm, and turn your feet slightly away from that side.;Push your hips toward the weight and slide your free hand down your leg, keeping your eyes on the kettlebell.;Reverse the movement to stand tall. Finish all reps, then switch sides. Use a light weight to start.
oh_carry|Hold a dumbbell overhead in one hand with your wrist stacked over your shoulder and your ribs down.;Walk slowly with tall posture and don't lean.;Finish the time, then switch hands.
trx_pike|Put your feet in the TRX straps in a push-up position with your hands on the floor.;Keeping your legs straight, lift your hips up toward the ceiling.;Lower back to the start with control.
trx_tuck|Put your feet in the TRX straps in a push-up position with your hands on the floor.;Pull your knees in toward your chest by bending them.;Straighten your legs back out to the start.
trx_oblique|Put your feet in the TRX straps in a push-up position with your hands on the floor.;Pull both knees in toward one elbow.;Return to the start. Finish all reps on one side, then switch.
ball_back_ext|Lie face down over the ball with your toes on the floor and your hands across your chest.;Lift your chest until your body is in one line.;Lower slowly.
decline_pu|Put your feet on the bench and your hands on the push-up bars under your shoulders.;Lower your chest between the bars with your body in one straight line.;Press back up. Move your feet to the floor if it's too hard.
cable_rev_curl|Attach the bar to a low pulley and hold it with a shoulder-width overhand grip.;With your elbows at your sides, raise the bar until your forearms are vertical.;Lower until your arms are straight.
cable_rev_tri|Set a high pulley with the bar and hold it with an underhand grip.;Press down until your arms are straight, elbows tight.;Return slowly.
cable_wide_row|Sit at the low pulley and hold the bar with a wide overhand grip.;Pull the bar to your lower chest with your elbows out.;Pause, then return slowly.
cable_bent_row|Set a low pulley and face it, hinged forward with a flat back.;Row the handle to your ribs.;Lower slowly.
crab_walk|Sit on the floor with your hands behind you and your feet flat.;Lift your hips by squeezing your glutes.;Take small alternating steps with your hands and feet, keeping your hips up.
jab_cross|Stand with your feet staggered, holding light dumbbells at your chin.;Punch one arm forward while pulling the other back.;Alternate smoothly and rotate through your torso.
ball_twist|Sit on the ball and walk your feet out until your upper back rests on it, with your feet flat and your hips lifted level with your knees.;Reach both arms straight up over your chest and clasp your hands.;Rotate your arms and ribs slowly toward one side, then return to the middle. Finish all reps on one side, then switch.
arnold_lat|Hold light dumbbells at your chest with your palms facing you.;Rotate and press them overhead like an Arnold press.;Lower, then raise your arms out to the sides for a lateral raise.
cable_rot_row|Sit at the low pulley and hold the handle with both hands.;Pull toward your ribs while rotating your torso slightly.;Return slowly and finish one side, then switch.
squat_row|Set the pulleys at chest height and hold the handles, facing the machine with your arms straight.;Sit back into a comfortable squat while your arms reach forward.;Stand up and row the handles to your ribs.
hang_clean|Hold dumbbells in front of your thighs and hinge back slightly.;Snap your hips forward and pull the dumbbells up to your shoulders.;Press them overhead, then lower with control.
kb_clean_press|Hinge back and grab the kettlebell handle on the floor in front of you.;Pull the bell up to your shoulder in one motion, then press it overhead.;Lower it to your shoulder, then to the floor. Switch sides.
inchworm|Stand tall, fold forward, and walk your hands out to a plank.;Do a push-up.;Walk your feet toward your hands and stand up.
reneg|Start in a plank with your hands on two dumbbells and your feet wide.;Row one dumbbell to your ribs without twisting your hips.;Lower it and switch sides.
trx_sq_row|Hold the TRX handles with your arms straight.;Sit back into a comfortable squat, leaning back on the straps.;Stand up while rowing your chest to your hands.
cable_lift_press|Set a pulley low and stand sideways, holding the handle with both hands near your hip.;Pull it diagonally up across your body to shoulder height.;Press it overhead, then lower back to your hip. Switch sides.
farmer|Stand holding a heavy dumbbell in each hand at your sides.;Walk with tall posture and small steady steps.;Walk for the time shown, then put the weights down with control.
high_knees|Stand tall.;Drive your knees up to hip height, one at a time, quickly.;Pump your arms and stay light. No jumping.
run_place|Stand tall.;Run in place as fast as you can with quick, light feet.;Pump your arms.
slider_mc|Start in a plank with your feet on the sliders.;Slide one knee toward your chest, then switch quickly.;Keep your hips low and level.
bear_tap|Get on your hands and knees, then lift your knees an inch off the floor.;Tap one shoulder with the opposite hand.;Keep your hips still and switch hands.
step_taps|Stand facing the step.;Tap one foot on, then the other, alternating quickly.;Stay light with no jumping.
skater_step|Stand on one leg with a slight bend in the knee.;Take a big step sideways onto the other leg while your back leg sweeps behind you and your arms swing across.;Tap your back toe lightly, then step back the other way. No hopping.
skater_jump|Stand on one leg with a slight bend in the knee.;Bound sideways to the other leg, landing softly while your back leg sweeps behind you and your arms swing across.;Keep going side to side with a steady rhythm.
mtn_climb|Start in a high plank with your hands under your shoulders.;Drive one knee toward your chest, then switch legs quickly, like running in place.;Keep your hips level and your core tight.
plank_drag|Start in a high plank with your feet wide and a dumbbell on the floor beside one hand.;Reach under your body with the opposite hand and drag the dumbbell across to the other side.;Keep your hips level and still, then drag it back the other way. Alternate sides.
cable_abd|Set the pulley low and attach the ankle cuff to the ankle farthest from the machine. Stand sideways and hold the frame.;Lift that leg straight out to the side without leaning.;Lower slowly. Finish all reps, then switch sides.
cable_add|Set the pulley low and attach the ankle cuff to the ankle nearest the machine. Stand sideways and hold the frame.;Swing that leg across the front of your body, squeezing your inner thigh.;Return slowly. Finish all reps, then switch sides.
cable_hip_flex|Set the pulley low, attach the cuff to one ankle, and face away from the machine holding the frame.;Lift your knee forward to hip height with a tall posture.;Lower slowly. Finish all reps, then switch legs.
cable_leg_curl|Set the pulley low, attach the cuff to one ankle, and face the machine holding the frame.;Curl your heel toward your glute, keeping your thighs together.;Lower slowly. Finish all reps, then switch legs.
knee_lift_steps|Take three quick steps to the right.;On the third step, drive your left knee up to hip height.;Take three steps back to the left and lift your right knee. Keep repeating.
plank|Place your forearms under your shoulders and extend your legs.;Squeeze your glutes and brace your core so your body is in one line.;Hold for the time shown and keep breathing.
body_saw|Start in a forearm plank with your feet on the sliders.;Rock your body forward and back by sliding your feet.;Keep your body stiff and your hips level.

function weightedPick(arr,wf,rng){

function build(rng,focus,phi,hist,seedTag){

  };
  // warm-up: mobility, activation, light cardio
  const warm=['warm','wact','wcard'].map(p=>pick([p])).filter(Boolean).map(x=>({id:x.id,secs:x.secs}));

function fit(w,rng,all,used,focus,phi,wf){

      if(cand){cand.sets--;continue}
      const gcand=w.main.filter(e=>!e.fin&&e.sets>2).sort((a,b)=>b.sets-a.sets)[0];
      if(gcand){
        if(w.format==='circuit') w.main.forEach(e=>{if(!e.fin&&e.sets>2) e.sets--});
        else if(gcand.grp){const g=w.main.filter(x=>x.grp===gcand.grp);g.forEach(x=>{if(x.sets>2)x.sets--})}
        else gcand.sets--;

      const idx=w.main.map((e,i)=>e.fin?-1:i).filter(i=>i>=0).pop();
      if(w.main.filter(e=>!e.fin).length>4&&idx>=0&&!w.main[idx].grp){w.main.splice(idx,1);continue}
      break;
    } else if(m<T-2){
      const cap=w.format==='circuit'?5:4;
      const upCand=w.main.filter(e=>!e.fin&&e.sets<cap).sort((a,b)=>a.sets-b.sets)[0];
      if(upCand){
        if(w.format==='circuit') w.main.forEach(e=>{if(!e.fin&&e.sets<cap) e.sets++});
        else if(upCand.grp){w.main.filter(x=>x.grp===upCand.grp).forEach(x=>{if(x.sets<cap)x.sets++})}

      if(!added&&w.format!=='circuit'){

        if(x){used.add(x.id);const e=mk(x);e.sets=Math.min(x.sets,3);e.slot=x.pat[0];

const sigIds=w=>new Set([...w.main,...w.abs].map(e=>e.id));
function jacc(a,b){let i=0;a.forEach(x=>{if(b.has(x)) i++});return i/(a.size+b.size-i)}
function maxSim(w,hist){
  const sig=sigIds(w);
  const same=hist.filter(h=>h.focus===w.focus).slice(-14), recent=hist.slice(-6);
  let m=0; new Set([...same,...recent]).forEach(h=>{m=Math.max(m,jacc(sig,sigIds(h)))});
  const exact=hist.some(h=>{const s=sigIds(h);const t=sigIds(w);return s.size===t.size&&jacc(s,t)===1});
  return exact?1:m;
}

function genWorkout(wk,di,focus,phi,regen,hist,sib){
  famPrep(); WKUSED=new Set((sib||[]).flatMap(x=>[...(x.warm||[]),...x.main,...x.abs].map(e=>e.id)));
  let best=null,last=null;
  for(let at=0;at<48;at++){
    const rng=mulberry(hash([wk,di,focus,regen,at].join('|')));
    const w=build(rng,focus,phi,hist);
    last=w;
    const sim=maxSim(w,hist);
    if(sim===1) continue;
    w.sim=sim;
    if(!best||sim<best.sim) best=w;
    if(sim<=0.34) break;
  }
  const w=best||last; w.id=wk+'#'+di; w.wk=wk; w.di=di; return w;
}

function genWeek(wk){
  if(!S.start) S.start=wk;
  const idx=weeksBetween(S.start,wk);
  const ph=((idx%4)+4)%4;
  const base=['pull','legs','push','full'];
  const rot=((idx%4)+4)%4;
  const order=base.map((_,i)=>base[(i+rot)%4]);
  const workouts=[];
  const hist=Object.keys(S.weeks).filter(k=>k<wk).sort().flatMap(k=>S.weeks[k].workouts);
  order.forEach((f,i)=>{workouts.push(genWorkout(wk,i,f,ph,S.regen[wk+'#'+i]||0,hist.concat(workouts),workouts))});
  S.weeks[wk]={ph,order,workouts};
}
function ensureWeek(wk){

  if(wk<cur){genWeek(wk);save();return}

}

function altOptions(w,block,i){
  const list=block==='abs'?w.abs:w.main; const e=list[i]; const cur=exById(e.id);
  const used=new Set([...w.main,...w.abs].map(x=>x.id)); famPrep();
  const others=new Set([...used]); others.delete(e.id); // the move being swapped out doesn't count against its own replacement
  const wkO=(S.weeks[w.wk]&&S.weeks[w.wk].workouts)||[]; // other toe-loading moves already planned this week (not counting the one being swapped out)
  const toeBusy=wkO.some(o=>[...(o.warm||[]),...o.main,...o.abs].some(x=>TOE.has(x.id)&&!(o===w&&x.id===e.id)));
  const ok=x=>available(x)&&!used.has(x.id)&&!famClash(x,others)&&!(toeOn()&&isToe(x)&&toeBusy);
  let same,related=[];
  if(block==='abs'){
    const pt=cur.pat.find(p=>/^c/.test(p));
    same=lib().filter(x=>ok(x)&&x.pat.includes(pt));
    related=lib().filter(x=>ok(x)&&x.pat.some(p=>/^c/.test(p))&&!x.pat.includes(pt));
  } else {
    let slot=e.slot||cur.pat[0];
    if(!lib().some(x=>x.pat.some(p=>slot.split(':')[0].split('/').includes(p)))) slot=cur.pat[0];
    const pats=slot.split(':')[0].split('/'); const f=slot.split(':')[1];
    same=lib().filter(x=>ok(x)&&x.pat.some(p=>pats.includes(p))&&(!f||x.f.includes(f)));
    const rel=new Set(); pats.forEach(p=>(RELATED[p]||[]).forEach(r=>rel.add(r)));
    related=lib().filter(x=>ok(x)&&!same.includes(x)&&x.pat.some(p=>rel.has(p))&&!x.pat.includes('comp')&&!x.pat.includes('warm'));
  }
  const fv=x=>(S.fav||[]).includes(x.id)?0:1; same.sort((a,b)=>fv(a)-fv(b)); related.sort((a,b)=>fv(a)-fv(b));
  return {same,related};
}
function swapEntry(w,idx,blockName,exId){

  const {same,related}=altOptions(w,blockName,idx);
  let x=exId?exById(exId):null;
  if(!x){
    if(!same.length) return false;
    const rng=mulberry(hash(w.id+idx+Date.now())); x=same[Math.floor(rng()*same.length)];

  const n=mk(x); n.slot=e.slot; if(e.fin) n.fin=1; n.grp=e.grp; n.lab=e.lab;

}

function suggest(ex,e,prev){

function chartSvg(pts,yl){
  if(!pts.length) return '<p class="empty">No data for this yet.</p>';
  const W=640,H=250,pl=48,pr=16,pt=16,pb=34;
  const ys=pts.map(p=>p.v); let lo=Math.min(...ys),hi=Math.max(...ys);
  if(lo===hi){lo=Math.max(0,lo-1);hi=hi+1}
  const pad=(hi-lo)*0.12; lo=Math.max(0,lo-pad); hi=hi+pad;
  const t0=parse(pts[0].d).getTime(),t1=parse(pts[pts.length-1].d).getTime();
  const X=p=>pl+(t1===t0?(W-pl-pr)/2:(parse(p.d).getTime()-t0)/(t1-t0)*(W-pl-pr));
  const Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const line=pts.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*10)/10}</text>`).join('');
  const dots=pts.map(p=>`<circle cx="${X(p).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="5" fill="var(--buoy)"><title>${p.d}: ${p.v} ${yl}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yl)} over time, ${pts.length} sessions">
    ${ticks}<path d="${line}" fill="none" stroke="var(--lane)" stroke-width="3" stroke-linejoin="round"/>${dots}
    <text x="${pl}" y="${H-10}">${pts[0].d}</text><text x="${W-pr}" y="${H-10}" text-anchor="end">${pts[pts.length-1].d}</text></svg>`;
}

function goalCard(){ // yearly swim goal: starts in 2027, shows whether you are ahead of or behind the pace
  const now=new Date(), yr=now.getFullYear(), goalMi=S.swimGoal===undefined?500:(+S.swimGoal||0);
  if(!goalMi||yr<2027) return '';
  const goalYd=goalMi*1760, jan1=new Date(yr,0,1), today0=new Date(yr,now.getMonth(),now.getDate());
  const dayN=Math.round((today0-jan1)/864e5)+1, daysIn=((yr%4===0&&yr%100!==0)||yr%400===0)?366:365;
  let done=0, noy=0; Object.keys(S.swim||{}).forEach(k=>{ if(k.slice(0,4)===String(yr)){ const y=ydOf(k); done+=y; if(!y) noy++ } });
  const expect=goalYd*dayN/daysIn, diff=done-expect, pct=Math.min(100,done/goalYd*100), exPct=Math.min(100,expect/goalYd*100);
  const leftYd=Math.max(0,goalYd-done), daysLeft=daysIn-dayN+1, wkLeft=Math.max(1,Math.round(daysLeft/7)), perWk=leftYd/Math.max(daysLeft/7,1/7);

function renderProgress(){
  const sessions=Object.values(S.sessions).filter(s=>s.done);
  const doneIds=Object.keys(S.sessions).filter(k=>S.sessions[k].done);
  const weeks=new Set(doneIds.map(k=>k.split('#')[0]));
  // streak: consecutive weeks (ending this/last week) with at least 3 finished workouts
  let streak=0; let cur=parse(iso(mondayOf(new Date())));
  const cnt=wk=>doneIds.filter(k=>k.startsWith(wk+'#')).length;
  if(cnt(iso(cur))<3) cur=addDays(cur,-7);
  while(cnt(iso(cur))>=3){streak++;cur=addDays(cur,-7)}
  const exIds=[...new Set(Object.values(S.sessions).flatMap(s=>Object.keys(s.sets)))].filter(id=>exSessions(id).length&&exById(id));
  exIds.sort((a,b)=>exById(a).n.localeCompare(exById(b).n));
  if(!U.sel||!exIds.includes(U.sel)) U.sel=exIds[0]||null;
  let body='';
  if(!U.sel) body='<p class="empty">Log a few sets on the Workout tab and your charts show up here.</p>';
  else{
    const ex=exById(U.sel); const ss=exSessions(U.sel);
    const pts=ss.map(s=>{
      const fr=flat(s.rows); const ws=fr.map(r=>+r.w||0), rs=fr.map(r=>+r.r||0);
      const v=U.metric==='top'?Math.max(...ws):U.metric==='vol'?fr.reduce((a,r)=>a+(+r.w||0)*(+r.r||0),0):Math.max(...rs);
      return {d:s.date,v};
    });
    const unitLbl=U.metric==='top'?wu(ex):U.metric==='vol'?wu(ex)+' total (weight × reps)':(ex.secs?'sec':'reps');
    body=`<div class="row"><select id="exsel" aria-label="Exercise">${exIds.map(id=>`<option value="${id}" ${id===U.sel?'selected':''}>${esc(exById(id).n)}</option>`).join('')}</select>
      <div class="seg" role="group" aria-label="Metric">
        <button data-act="metric" data-k="top" aria-pressed="${U.metric==='top'}">Top weight</button>
        <button data-act="metric" data-k="vol" aria-pressed="${U.metric==='vol'}">Total volume</button>
        <button data-act="metric" data-k="reps" aria-pressed="${U.metric==='reps'}">Best reps</button></div></div>
      <p class="note">${unitLbl}</p>${chartSvg(pts,unitLbl)}
      <table><thead><tr><th>Date</th><th>Sets (weight × reps)</th></tr></thead><tbody>
      ${[...ss].reverse().map(s=>`<tr><td>${s.date}</td><td>${fmtRows(s.rows)}</td></tr>`).join('')}</tbody></table>`;
  }
  return `<h2>Progress</h2>
  ${calendarCard()}
  ${goalCard()}
  ${swimCard()}
  <div class="stats" style="margin-top:12px">
    <div class="stat"><b>${doneIds.length}</b><span>workouts finished</span></div>
    <div class="stat"><b>${weeks.size}</b><span>weeks trained</span></div>
    <div class="stat"><b>${streak}</b><span>week streak (3+ workouts)</span></div></div>
  <div class="card"><h3>Exercise history</h3>${body}</div>`;
}

let RT=null;
function stopRest(){ if(RT){cancelSched(); clearInterval(RT.t); if(RT.trk) trackStop(); RT=null} const r=document.getElementById('rest'); if(r) r.remove() }
let NOREST=0;
function startRest(secs,label){
  if(Date.now()<NOREST) return;
  stopRest(); closeTimer();
  unlockAudio();
  const el=document.createElement('div'); el.id='rest'; el.setAttribute('role','status');
  el.innerHTML=`<div class="rinfo"><span class="rl">Rest</span><b class="rn">${secs}</b><span class="rs">sec</span><button class="redit" id="redit" aria-label="Edit rest time" title="Edit rest time">✎</button></div><div class="rbtns"><button class="btn small" id="rminus">−15</button><button class="btn small" id="rplus">+15</button><button class="btn small teal" id="rskip">Skip</button></div>`;
  document.body.appendChild(el);

  const plan=()=>{ cancelSched(); const left=Math.max(0,(RT.end-Date.now())/1000); const ns=[]; let wn=null; if(left>10&&secs>15){wn=schedDing(1175,400,0.3,left-10); ns.push(wn)} ns.push(schedDing(880,250,0.35,left),schedDing(1320,500,0.4,left+0.3),schedDing(1320,450,0.35,left+0.85)); RT.nodes=ns.filter(Boolean); RT.pre=RT.nodes.length>=3; RT.preWarn=!!wn; RT.tgt=audioCtx?audioCtx.currentTime+left:0; RT.tgtW=audioCtx?audioCtx.currentTime+left-10:0; };
  const played=t=>!!(audioCtx&&audioCtx.state==='running'&&audioCtx.currentTime>=t-0.3); // did the pre-scheduled sound really get its turn?
  const planTrack=first=>{ const left=Math.max(0,(RT.end-Date.now())/1000), ev=[]; if(first) ev.push([0,523,170,0.3]); if(left>10&&secs>15) ev.push([left-10,1175,400,0.3]); ev.push([left,880,250,0.35],[left+0.3,1320,500,0.4],[left+0.85,1320,450,0.35]); RT.trk=trackPlay(ev,left+1.6) };
  if(S.engine==='player'&&S.sound!=='off') planTrack(true);
  if(!RT.trk){ plan(); ding(523,170,0.3) } // soft low note: the rest has started
  const l=el.querySelector('.rl');
  const tick=()=>{ if(!RT) return;
    const n=el.querySelector('.rn'); if(!n) return; const left=Math.max(0,Math.ceil((RT.end-Date.now())/1000)); n.textContent=left;
    el.classList.toggle('low',left<=10&&left>0);
    if(left<=10&&left>0&&!RT.dinged&&secs>15){RT.dinged=true;if(!RT.trk&&!(RT.preWarn&&played(RT.tgtW)))ding(1175,400,0.3)}
    if(left<=0&&!RT.done){RT.done=true;clearInterval(RT.t);l.textContent='Go!';n.textContent='';el.classList.add('fin');if(!RT.trk&&!(RT.pre&&played(RT.tgt))){cancelSched();chime([[880,0,250,0.35],[1320,0.3,500,0.4],[1320,0.85,450,0.35]])}haptic('go'); setTimeout(()=>{if(RT&&RT.done)stopRest()},4000)}
  };
  el.querySelector('#rskip').onclick=stopRest;
  const setEnd=ms=>{ if(!RT) return; if(RT.done){RT.done=false;RT.dinged=false;l.textContent='Rest';el.classList.remove('fin');RT.t=setInterval(tick,250)} RT.end=Date.now()+ms; RT.dinged=ms/1000<=10; if(RT.trk) planTrack(false); else plan(); tick() };
  el.querySelector('#rplus').onclick=()=>{ if(!RT) return; setEnd(RT.done?15000:Math.max(0,RT.end-Date.now())+15000) };
  el.querySelector('#rminus').onclick=()=>{ if(!RT||RT.done) return; setEnd(Math.max(5000,RT.end-Date.now()-15000)) };
  el.querySelector('#redit').onclick=()=>{ if(!RT) return; const rn=el.querySelector('.rn'); if(el.querySelector('.rin')){return}
    const cur=Math.max(5,Math.ceil((RT.end-Date.now())/1000)); const inp=document.createElement('input'); inp.type='number'; inp.inputMode='numeric'; inp.className='rin'; inp.value=cur; inp.min=5; inp.max=600;
    clearInterval(RT.t); rn.replaceWith(inp); inp.focus(); inp.select();
    const done=()=>{ if(!RT) return; const v=Math.max(5,Math.min(600,parseInt(inp.value,10)||cur)); const b=document.createElement('b'); b.className='rn'; inp.replaceWith(b); RT.t=setInterval(tick,250); setEnd(v*1000) };
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();inp.blur()}}); inp.addEventListener('blur',done,{once:true}) };
  tick(); RT.t=setInterval(tick,250);
}

function autoFoldCard(art,after,delay){

function afterSet(btn){
  const [block,i,n,k]=btn.dataset.set.split('|'); const art=btn.closest('article.ex'); if(!art) return;
  const w=getWorkout(U.wk,U.day); const list=block==='abs'?w.abs:w.main; const e=list[+i]; const ex=e&&exById(e.id);
  if(block==='main'&&e&&e.grp){ // superset or circuit: hop A1 -> A2 -> (rest) -> A1 ...
    const idxs=w.main.map((x,ix)=>x.grp===e.grp?ix:-1).filter(ix=>ix>=0), pos=idxs.indexOf(+i), nn=+n;
    const openIn=(ix,s)=>{const c=document.querySelector(`article.ex[data-card="main|${ix}"]`); return c&&[...c.querySelectorAll(`button.ck[data-set^="main|${ix}|${s}|"]`)].find(x=>!x.classList.contains('on'))};
    let target=openIn(+i,nn), rest=false;
    if(!target){ for(let p=pos+1;p<idxs.length&&!target;p++) target=openIn(idxs[p],nn);
      if(!target){ rest=true;
        for(let s2=nn+1;s2<12&&!target;s2++) for(let p=0;p<idxs.length&&!target;p++) target=openIn(idxs[p],s2);
        for(let s2=0;s2<=nn&&!target;s2++) for(let p=0;p<idxs.length&&!target;p++) target=openIn(idxs[p],s2);
        if(!target){ const lastCard=document.querySelector(`article.ex[data-card="main|${idxs[idxs.length-1]}"]`); const all=[...document.querySelectorAll('article.ex')]; const nx=all[all.indexOf(lastCard)+1]; if(nx) target=nx.querySelector('button.ck:not(.on)')||nx }
      } }

    if(rest&&S.autoRest!==false){ const lastE=w.main[idxs[idxs.length-1]]; setTimeout(()=>startRest((lastE&&lastE.rest)||e.rest||60),250) }
    if(target.matches&&target.matches('button.ck')) focusSet(target); else target.scrollIntoView({behavior:'smooth',block:'center'});

  }
  let target=[...art.querySelectorAll('button.ck')].find(x=>!x.classList.contains('on'));
  let atEnd=false;
  if(!target){ const arts=[...document.querySelectorAll('article.ex')]; const nx=arts[arts.indexOf(art)+1];

function trackPlay(events,total){ // returns true if the sound was handed to the phone
  trackStop(); if(S.sound==='off') return false;
  try{
    setSess(S.sound==='loud'?'playback':'ambient');
    if(!TE){ TE=new Audio(); TE.setAttribute('playsinline',''); TE.preload='auto' } // one player, reused: once a tap has started it, later tracks may start without a tap
    const url=URL.createObjectURL(trackWav(events,total)); TRK={url,failed:false}; const me=TRK;
    TE.src=url; const p=TE.play(); if(p&&p.catch) p.catch(()=>{me.failed=true});
    return true;
  }catch(e){ return false }
}
function setSess(t){ try{ if(navigator.audioSession&&navigator.audioSession.type!==t) navigator.audioSession.type=t }catch(e){} }
function unlockAudio(){
  if(S.sound==='off') return;
  if(S.engine==='player'){ if(!(TRK&&TE&&!TE.paused)) setSess(S.sound==='loud'?'playback':'ambient'); return }
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    if(audioCtx&&audioCtx.state==='running') return;   // already awake: leave the phone's audio alone
    setSess('ambient');                                 // ambient mixes with an audiobook
    audioCtx=audioCtx||new C(); if(audioCtx.state!=='running') audioCtx.resume();
    const b=audioCtx.createBuffer(1,1,22050), src=audioCtx.createBufferSource(); src.buffer=b; src.connect(audioCtx.destination); src.start(0);
  }catch(e){}
}
['touchend','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
let hapEl=null, hapLast=0;
function haptic(kind){
  if(S.haptics===false) return;
  const now=Date.now(); if(kind==='tick'&&now-hapLast<60) return; hapLast=now;
  try{ if(navigator.vibrate){ navigator.vibrate(kind==='success'?[30,50,30,50,60]:kind==='done'?[25,45,25]:kind==='go'?[60,60,60]:12); return } }catch(e){}
  try{ // iPhone Safari has no vibrate; a hidden switch control gives a tap when toggled
    if(!hapEl){ hapEl=document.createElement('label'); hapEl.setAttribute('aria-hidden','true'); hapEl.style.cssText='position:fixed;left:0;bottom:0;width:44px;height:30px;opacity:.02;pointer-events:none;z-index:-1';
      const i=document.createElement('input'); i.type='checkbox'; i.setAttribute('switch',''); i.tabIndex=-1; hapEl.appendChild(i); document.body.appendChild(hapEl) }
    const keep=document.activeElement;
    const pulse=()=>{ hapEl.click(); if(keep&&keep!==document.activeElement&&/^(INPUT|TEXTAREA)$/.test(keep.tagName)&&keep.type!=='checkbox'){ try{keep.focus({preventScroll:true})}catch(e){} } };
    pulse();
    if(kind==='done'){ setTimeout(pulse,80) }
    else if(kind==='success'){ setTimeout(pulse,80); setTimeout(pulse,170); setTimeout(pulse,280) }
    else if(kind==='go'){ setTimeout(pulse,90); setTimeout(pulse,180) }
  }catch(e){}
}
function chime(notes){ // several notes as one sound: waits until the audio is awake, then plays them back to back so none is swallowed
  if(S.sound==='off') return;
  if(S.engine==='player'){ const tot=notes.reduce((m,[,at,ms])=>Math.max(m,at*1000+ms),0)/1000; trackPlay(notes.map(([f,at,ms,v])=>[at,f,ms,v]),tot+0.3); return }
  try{
    if(!audioCtx){ unlockAudio() }
    if(!audioCtx) return;
    const total=notes.reduce((m,[,at,ms])=>Math.max(m,at*1000+ms),0);
    if(S.sound==='loud'){ setSess('playback'); clearTimeout(audioSessTimer); audioSessTimer=setTimeout(()=>setSess('ambient'),total+900) }
    const go=()=>{ try{ const t0=audioCtx.currentTime+0.12;
      notes.forEach(([f,at,ms,v])=>{ const gain=Math.min(1,(v||0.3)*(S.sound==='loud'?3:2.4));
        const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
        g.gain.setValueAtTime(0.0001,audioCtx.currentTime); g.gain.setValueAtTime(gain,t0+at); g.gain.exponentialRampToValueAtTime(0.001,t0+at+ms/1000);
        o.start(t0+at); o.stop(t0+at+ms/1000+0.05) }) }catch(e){} };
    if(audioCtx.state==='running') go(); else { const p=audioCtx.resume(); if(p&&p.then) p.then(go).catch(go); else go() }
  }catch(e){}
}
function ding(f,ms,vol){
  if(S.sound==='off') return;
  if(S.engine==='player'){ trackPlay([[0,f,ms,vol]],ms/1000+0.2); return }
  try{ if(audioCtx){
    if(audioCtx.state!=='running') audioCtx.resume();
    if(S.sound==='loud'){ setSess('playback'); clearTimeout(audioSessTimer); audioSessTimer=setTimeout(()=>setSess('ambient'),ms+900) } // take over briefly, then give audio back
    const gain=Math.min(1,(vol||0.3)*(S.sound==='loud'?3:2.4));
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;
    g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+ms/1000);
    o.start();setTimeout(()=>{try{o.stop()}catch(e){}},ms+30)} }catch(e){}
}

function schedDing(f,ms,vol,when){ // pre-schedule a ding on the audio clock so it plays even if no tap happens at that moment
  if(S.sound==='off'||S.engine==='player'||!audioCtx) return null;
  try{ if(audioCtx.state!=='running') audioCtx.resume();
    const t=audioCtx.currentTime+when, gain=Math.min(1,(vol||0.3)*(S.sound==='loud'?3:2.4));
    const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0.0001,audioCtx.currentTime); g.gain.setValueAtTime(gain,t); g.gain.exponentialRampToValueAtTime(0.001,t+ms/1000);
    o.start(t); o.stop(t+ms/1000+0.05); return o }catch(e){ return null }
}
function cancelSched(){ if(RT&&RT.nodes){ RT.nodes.forEach(o=>{try{o.stop()}catch(e){}}); RT.nodes=[] } }
function beep(){
  chime([[880,0,350,0.3],[880,0.45,350,0.3],[1175,0.9,700,0.3]]);
  haptic('success');
}
let TM=null;
function tmCancel(){ if(TM&&TM.nodes){ TM.nodes.forEach(o=>{try{o.stop()}catch(e){}}); TM.nodes=[] } trackStop() }
function tmEvents(){ // every beep still to come, in seconds from right now
  const left=Math.max(0,(TM.end-Date.now())/1000), ev=[];
  if(TM.phase==='ready'){
    for(let m=Math.floor(left+0.15);m>=1;m--) ev.push([Math.max(0,left-m),660,160,0.3]);
    ev.push([left,1320,700,0.4]);
    const total=TM.total; if(total>10) ev.push([left+total-10,1175,500,0.35]);
    ev.push([left+total,880,350,0.3],[left+total+0.45,880,350,0.3],[left+total+0.9,1175,700,0.3]);
  } else {
    if(!TM.dinged&&TM.total>10&&left>10) ev.push([left-10,1175,500,0.35]);
    ev.push([left,880,350,0.3],[left+0.45,880,350,0.3],[left+0.9,1175,700,0.3]);
  }
  return ev;
}
function tmPlan(){ // lay out ALL of the timer's beeps ahead of time (ready ticks, start, 10-second warning, finish) so none depends on a live tap
  if(!TM) return; tmCancel(); TM.pre=false; TM.trk=false; if(TM.paused||TM.done||S.sound==='off') return;
  const ev=tmEvents(), end=ev.reduce((m,e)=>Math.max(m,e[0]+e[2]/1000),0)+0.3;
  if(S.engine==='player'){ TM.pre=trackPlay(ev,end); TM.trk=TM.pre; return }
  TM.nodes=ev.map(([at,f,ms,v])=>schedDing(f,ms,v,at)).filter(Boolean); TM.pre=ev.length>0&&TM.nodes.length===ev.length;
  TM.tgt=audioCtx?audioCtx.currentTime+(ev.length?ev[ev.length-3][0]:0):0;
}
function tmLive(){ return !(TM&&TM.pre&&(TM.trk?!(TRK&&TRK.failed):(audioCtx&&audioCtx.state==='running'))) } // true = nothing is pre-arranged, so beep live
function closeTimer(){
  tmCancel(); if(!TM) return; if(TM.logFn&&TM.phase==='run'&&!TM.done){ const lf=TM.logFn; TM.logFn=null; const left=TM.paused?TM.left:Math.max(0,(TM.end-Date.now())/1000); const el2=Math.round(TM.total-left); if(el2>=3) lf(el2) } if(TM.markFn){ const f=TM.markFn; TM.markFn=null; setTimeout(f,0) } clearInterval(TM.t); try{TM.wl&&TM.wl.release()}catch(e){}
  const el=document.getElementById('tmr'); if(el) el.remove(); TM=null;
}
function runTimer(btn){
  if(TM&&TM.markFn){ const f=TM.markFn; TM.markFn=null; NOREST=Date.now()+700; f() } // starting again/next: still tick the finished set, but no rest
  if(TM&&TM.logFn&&TM.phase==='run'&&!TM.done) NOREST=Date.now()+700;
  closeTimer(); stopRest();
  unlockAudio();
  const total=+btn.dataset.secs||30, READY=5;
  const host=btn.closest('article.ex,li'); const cardKey=host&&host.dataset?host.dataset.card:''; const nm=host&&host.querySelector('h3,.wh b'); const name=nm?nm.textContent:'Timer';
  const R=88, C2=2*Math.PI*R;
  const el=document.createElement('div'); el.id='tmr'; el.className='ready'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Timer');
  el.innerHTML=`<div class="tbox"><p class="tname">${esc(name)}</p>
    <div class="tring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="tbg" cx="100" cy="100" r="${R}"/><circle class="tfg" cx="100" cy="100" r="${R}" stroke-dasharray="${C2}" stroke-dashoffset="0" transform="rotate(-90 100 100)"/></svg>
    <div class="tnum" aria-live="off">${READY}</div></div>
    <p class="tsub">Get ready</p>
    <div class="trow"><button class="btn teal" id="tpause">Pause</button><button class="btn" id="tclose">Close</button></div></div>`;
  document.body.appendChild(el);
  TM={phase:'ready',end:Date.now()+READY*1000,left:READY,last:READY+1,total,paused:false,dinged:false,done:false,t:null,wl:null,pre:false,trk:false,nodes:[]};
  if(!btn.dataset.warm&&!btn.dataset.cool) TM.logFn=sec=>{ const art=(cardKey&&document.querySelector(`article.ex[data-card="${cardKey}"]`))||btn.closest('article.ex'); const ck=art&&[...art.querySelectorAll('button.ck')].find(x=>!x.classList.contains('on')); if(!ck) return; const ri=document.querySelector(`input[data-set="${ck.dataset.set}"]`); if(ri) ri.value=String(sec); ck.click(); toast('Logged '+sec+' sec') };
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>{TM?TM.wl=w:w.release()}).catch(()=>{}) }catch(e){}
  const num=el.querySelector('.tnum'), fg=el.querySelector('.tfg'), sub=el.querySelector('.tsub'), pb=el.querySelector('#tpause');
  const paint=(left,max)=>{ num.textContent=left; fg.style.strokeDashoffset=String(C2*(1-left/max)); el.classList.toggle('low',TM.phase==='run'&&left<=10&&left>0) };
  const tick=()=>{
    if(!TM||TM.paused||TM.done) return;
    const left=Math.max(0,Math.ceil((TM.end-Date.now())/1000)); TM.left=left;
    if(TM.phase==='ready'){
      if(left>0){ if(left!==TM.last){TM.last=left;if(tmLive())ding(660,160,0.3)} paint(left,READY); return }
      TM.phase='run'; TM.end=Date.now()+total*1000; TM.left=total; TM.dinged=false;
      el.classList.remove('ready'); sub.textContent='seconds left'; paint(total,total); if(tmLive())ding(1320,700,0.4);
      haptic('go');
      return;
    }
    paint(left,total);
    if(left<=10&&left>0&&!TM.dinged&&total>10){TM.dinged=true;if(tmLive())ding(1175,500,0.35)}
    if(left<=0){TM.done=true;clearInterval(TM.t);num.textContent='Done';fg.style.strokeDashoffset=String(C2);el.classList.remove('low');el.classList.add('fin');sub.textContent='Nice work';pb.textContent='Again';{if(!tmLive()) haptic('success'); else {tmCancel(); beep()}}
      if(btn.dataset.warm) setWarm(btn.dataset.warm,true);
      else if(btn.dataset.cool) setCool(btn.dataset.cool,true);
      else { const tm=TM; let did=false;
        tm.markFn=()=>{ if(did) return; did=true; clearTimeout(tm.mt); // timed exercise finished: log the next open set (this also starts the rest)
          const art=(cardKey&&document.querySelector(`article.ex[data-card="${cardKey}"]`))||btn.closest('article.ex'); const ck=art&&[...art.querySelectorAll('button.ck')].find(x=>!x.classList.contains('on')); if(ck) ck.click() };
        tm.mt=setTimeout(tm.markFn,2200) } }
  };
  pb.onclick=()=>{
    if(TM.done){runTimer(btn);return}
    if(TM.paused){TM.paused=false;TM.end=Date.now()+TM.left*1000;pb.textContent='Pause';sub.textContent=TM.phase==='ready'?'Get ready':'seconds left';tmPlan()}
    else{TM.paused=true;tmCancel();pb.textContent='Resume';sub.textContent='paused'}
  };
  el.querySelector('#tclose').onclick=closeTimer;
  tmPlan(); tick(); TM.t=setInterval(tick,200);
}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&U.swap){U.swap=null;render(true)}});
function storeSet(t){
  const [block,i,n,k]=t.dataset.set.split('|'); const w=getWorkout(U.wk,U.day);
  const e=(block==='abs'?w.abs:w.main)[+i]; const s=sess(w.id);
  const arr=s.sets[e.id]||(s.sets[e.id]=[]); const row=arr[+n]||(arr[+n]={w:'',r:''});
  row[k]=t.value.replace(',','.'); row.t=e.secs?1:0;
  if(k==='r'||k==='lr'){ // typing reps also records the weight shown in that row, even if it was prefilled
    const wk=k==='r'?'w':'lw'; const wi=document.querySelector(`input[data-set="${block}|${i}|${n}|${wk}"]`); if(wi) row[wk]=wi.value.replace(',','.');
  }
  for(let j=0;j<arr.length;j++) if(!arr[j]) arr[j]={w:'',r:''};
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.note) return; // notes save with the Save button

  if(t.dataset&&t.dataset.set){
    t.classList.remove('pre'); delete t.dataset.auto; storeSet(t);
    if(/\|l?w$/.test(t.dataset.set)){ // copy this weight into the empty boxes that follow, so you only type it once
      const card=t.closest('article.ex'); const ws=card?[...card.querySelectorAll('input[data-set]')].filter(x=>/\|l?w$/.test(x.dataset.set)):[];
      const me=ws.indexOf(t);
      for(let q=me+1;q<ws.length;q++){ const x=ws[q];
        if(x.value.trim()!==''&&!x.dataset.auto&&!x.classList.contains('pre')) break; // stop at a box you typed yourself or already logged; boxes prefilled from last time follow along
        x.value=t.value; if(t.value.trim()===''){x.classList.remove('pre');delete x.dataset.auto} else {x.classList.add('pre');x.dataset.auto='1'}
        storeSet(x) }
    }
    if(/\|l?r$/.test(t.dataset.set)){
      const ck=document.querySelector(`[data-act="setdone"][data-set="${t.dataset.set}"]`);
      if(ck){
        const wasOn=ck.classList.contains('on'); const on=t.value!==''; ck.classList.toggle('on',on); ck.setAttribute('aria-pressed',String(on)); 
        // finished typing reps for a new set: start rest and move on after a short pause
        if(!on){ clearTimeout(ck._rt); delete ck.dataset.pend }
        else if(!wasOn||ck.dataset.pend){
          ck.dataset.pend='1'; clearTimeout(ck._rt);
          ck._rt=setTimeout(()=>{ delete ck.dataset.pend; if(t.value!==''&&ck.classList.contains('on')){ if(!isGroupedBtn(ck)){ try{t.blur()}catch(e){} } afterSet(ck) } },1400);
        }
      }
    }
    updateDone(true);
    clearTimeout(window.__sv); window.__sv=setTimeout(save,250);
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='exsel'){U.sel=t.value;render(true)}
  else if(t.dataset.gear){S.gear[t.dataset.gear]=t.checked;save();const en=document.querySelector('.eqd .eqn');if(en)en.textContent=GEAR.filter(g=>S.gear[g[0]]).length+' of '+GEAR.length+' checked'}
  else if(t.id==='knee'){S.knee=+t.value;save()}
  else if(t.id==='sound'){S.sound=t.value;save();unlockAudio();chime([[1175,0,500,0.4],[1320,0.35,500,0.4]])}
  else if(t.id==='engine'){S.engine=t.value;save();trackStop();unlockAudio();chime([[1175,0,500,0.4],[1320,0.35,500,0.4]])}
  else if(t.id==='haptics'){S.haptics=t.checked;save(); if(t.checked) haptic('done')}
  else if(t.id==='bkdays'){S.backupDays=+t.value; save(); toast(S.backupDays?'Backup reminder updated':'Backup reminder turned off')}
  else if(t.id==='toecare'){S.toeCare=t.checked;save()}
  else if(t.id==='autofold'){S.autoFold=t.checked;save()}
  else if(t.id==='autorest'){S.autoRest=t.checked;save(); if(!t.checked) stopRest()}
  else if(t.id==='wdate'){
    if(!t.value) return;
    const w=getWorkout(U.wk,U.day); const se=sess(w.id); se.date=t.value; se.dateEdited=1; if(se.done) se.done=t.value; if(w.extra) w.date=t.value;
    save(); toast('Date updated'); render(true);
  }
  else if(t.id==='swgoal'){S.swimGoal=Math.max(0,Math.min(5000,Math.round(+t.value||0)));save()}
  else if(t.id==='dbmax'){S.dbmax=Math.min(100,Math.max(5,+t.value||25));save()}
  else if(t.id==='tgt'){S.target=Math.min(90,Math.max(25,+t.value||45));save()}
  else if(t.dataset.day!==undefined){
    const vals=[...document.querySelectorAll('[data-day]')].map(s=>+s.value);
    if(new Set(vals).size<4){toast('Pick four different days');render(true);return}
    S.days=vals; save(); toast('Days updated');
  }
  else if(t.id==='imp'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result); if(!d||!d.sessions||!d.weeks) throw 0; S=Object.assign(DEFAULTS(),d); save(); render(true); toast('Backup restored')}catch(e){toast('That file is not a SwimLift backup')}};
    r.readAsText(t.files[0]);
  }
});
