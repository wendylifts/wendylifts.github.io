<style>
:root{
  --bg:#EDF5F6; --surface:#FFFFFF; --ink:#0B2533; --muted:#587280; --line:#D0E1E5;
  --lane:#0A8FA3; --link:#076A7A; --lane-ink:#FFFFFF; --buoy:#E8472B; --deep:#0B3C5D; --soft:#E3F1F4; --ok:#1F8A5B;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#08171F;--surface:#0F2530;--ink:#E6F2F5;--muted:#8FB0BC;--line:#1D3A47;--lane:#35C2D6;--link:#35C2D6;--lane-ink:#06222A;--buoy:#FF7A59;--deep:#0B3C5D;--soft:#12303C;--ok:#4CC48C}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--buoy);outline-offset:2px}
.top{background:var(--deep);color:#fff}
.top-in{max-width:880px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--head);font-weight:700;font-size:30px;letter-spacing:.5px;line-height:1}
.nav{display:flex;gap:4px}
.nav a{display:inline-block;color:#cfe6ee;padding:8px 10px;font-weight:600;border-bottom:3px solid transparent;border-radius:4px 4px 0 0;text-decoration:none}
.nav a[aria-current="page"]{color:#fff;border-bottom-color:var(--buoy)}
.rope{height:10px;background:repeating-linear-gradient(90deg,var(--buoy) 0 14px,#fff 14px 28px,var(--lane) 28px 42px,#fff 42px 56px)}
main{max-width:880px;margin:0 auto;padding:16px 16px 80px}
h1,h2,h3{font-family:var(--head);font-weight:700;margin:0;line-height:1.1}
h2{font-size:28px}
h3{font-size:21px}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.weekbar .ttl{display:flex;flex-direction:column}
.weekbar .sub{color:var(--muted);font-size:14px}
.stepper{display:flex;gap:6px}
.btn{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--lane)}
.btn.primary{background:var(--buoy);border-color:var(--buoy);color:#fff}
.btn.teal{background:var(--lane);border-color:var(--lane);color:var(--lane-ink)}
.btn.small{padding:5px 10px;font-size:14px;border-radius:8px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-block;background:var(--soft);color:var(--ink);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:600}
.hero{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:6px}
.hero h2{font-size:32px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.note{color:var(--muted);font-size:14px;margin:4px 0}
.sec{margin:22px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h3{font-size:24px}

  legs:{n:'Legs & hips',d:'Knee-friendly strength for push-offs and kick.'},
  push:{n:'Push & shoulder health',d:'Pressing balanced with shoulder stability.'},
  full:{n:'Full-body power',d:'Big compound moves plus a conditioning finisher.'}
};
const PHASES=[
  {n:'Build',d:'Moderate weights and controlled tempo.'},
  {n:'Strength',d:'Heavier loads on the first moves, longer rests.'},
  {n:'Volume',d:'Lighter weights, more reps, shorter rests.'},
  {n:'Recover',d:'Lighter week: use lighter weights and leave 3 reps in the tank.'}
];
const TPL={
  pull:[{p:['vpull']},{p:['hpull']},{p:['comp'],f:'pull'},{p:['shoulder']},{p:['bi']},{p:['hpull','vpull']}],
  legs:[{p:['squat']},{p:['hinge']},{p:['single','glute']},{p:['ham']},{p:['comp'],f:'legs'},{p:['calf']}],
  push:[{p:['hpush']},{p:['vpush','hpush']},{p:['comp'],f:'push'},{p:['shoulder']},{p:['tri']},{p:['hpull']}],
  full:[{p:['comp'],f:'full'},{p:['comp'],f:'full'},{p:['hinge','squat','carry']},{p:['vpull','hpull']},{p:['hpush','vpush']},{p:['cardio'],fin:1}]
};
const EXTRA={pull:['bi','hpull','shoulder'],legs:['glute','calf','single'],push:['tri','shoulder','hpush'],full:['shoulder','hpull','vpush']};

function weightedPick(arr,wf,rng){
  if(!arr.length) return null;
  const ws=arr.map(wf); const tot=ws.reduce((a,b)=>a+b,0);
  let r=rng()*tot; for(let i=0;i<arr.length;i++){r-=ws[i]; if(r<=0) return arr[i]}
  return arr[arr.length-1];
}

function workSecs(e){
  if(e.secs) return e.secs;
  const ex=exById(e.id); return ((e.lo+e.hi)/2)*3.2*(ex&&ex.u?2:1);
}
function estimate(w){
  let s=300;
  const seen={};
  for(const e of w.main){
    if(!e.grp){s+=e.sets*(workSecs(e)+e.rest+10);continue}
    if(seen[e.grp]) continue; seen[e.grp]=1;
    const g=w.main.filter(x=>x.grp===e.grp);
    const sets=Math.max(...g.map(x=>x.sets));
    if(w.format==='circuit') s+=sets*(g.reduce((a,x)=>a+workSecs(x)+12,0)+75);
    else s+=sets*(g.reduce((a,x)=>a+workSecs(x)+10,0)+Math.max(...g.map(x=>x.rest))*0.7);
  }
  for(const e of w.abs) s+=e.sets*(workSecs(e)+e.rest+8);
  return Math.round(s/60);
}

function mk(ex){return {id:ex.id,sets:ex.sets,lo:ex.lo,hi:ex.hi,secs:ex.secs||0,rest:ex.rest}}
function applyPhase(e,ex,phi,idx){
  if(phi===1 && ex.l && !ex.secs && idx<2){e.sets=4;e.lo=5;e.hi=6;e.rest+=30}
  else if(phi===2){
    if(ex.secs) e.secs+=10; else {e.lo=Math.min(e.lo+3,18);e.hi=Math.min(e.hi+4,22)}
    e.rest=Math.max(30,e.rest-20);
  }
}

function build(rng,focus,phi,hist,seedTag){
  const all=lib().filter(available);
  const recent={}; hist.slice(-6).forEach(w=>[...w.main,...w.abs].forEach(e=>recent[e.id]=(recent[e.id]||0)+1));
  const prevSame=[...hist].reverse().find(w=>w.focus===focus);
  const prevIds=new Set(prevSame?[...prevSame.main,...prevSame.abs].map(e=>e.id):[]);
  const used=new Set();
  const wf=x=>(1/(1+(recent[x.id]||0)*0.8))*(prevIds.has(x.id)?0.3:1)*(S.fav&&S.fav.includes(x.id)?2.5:1);
  const pick=(pats,f)=>{
    const c=all.filter(x=>!used.has(x.id)&&x.pat.some(p=>pats.includes(p))&&(!f||x.f.includes(f)));
    const x=weightedPick(c,wf,rng); if(x) used.add(x.id); return x;
  };
  // warm-up: mobility, activation, light cardio
  const warm=['warm','wact','wcard'].map(p=>pick([p])).filter(Boolean).map(x=>({id:x.id,secs:x.secs}));
  // strength
  const main=[];
  TPL[focus].forEach((slot,i)=>{
    const x=pick(slot.p,slot.f); if(!x) return;
    const e=mk(x); e.slot=slot.p.join('/')+(slot.f?':'+slot.f:''); if(slot.fin){e.fin=1}
    applyPhase(e,x,phi,i); main.push(e);
  });
  // format
  const fm=phi===1?[['straight',6],['superset',3],['circuit',0]]:phi===2?[['straight',2],['superset',4],['circuit',4]]:[['straight',4],['superset',4],['circuit',2]];
  const lastFmt=hist.length?hist[hist.length-1].format:'';
  let format=weightedPick(fm,f=>f[1]*(f[0]===lastFmt?0.4:1)+0.001,rng)[0];
  const body=main.filter(e=>!e.fin);
  if(body.length<4) format='straight';
  if(format==='superset'){
    body.forEach((e,i)=>{e.lab=String.fromCharCode(65+Math.floor(i/2))+((i%2)+1);e.grp=String.fromCharCode(65+Math.floor(i/2))});}
  if(format==='circuit'){const r=3;body.forEach((e,i)=>{e.grp='C';e.lab='C'+(i+1);e.sets=r})}
  const w={focus,phase:phi,format,warm,main,abs:[]};
  // abs: anti-extension/rotation first, then two different patterns
  const abs=[]; const usedPats=new Set();
  const addAbs=pats=>{
    const c=all.filter(x=>!used.has(x.id)&&x.pat.some(p=>pats.includes(p)&&!usedPats.has(p)));
    const x=weightedPick(c,wf,rng); if(!x) return;
    used.add(x.id); usedPats.add(x.pat.find(p=>pats.includes(p))); abs.push(mk(x));
  };
  addAbs(['cae','car']); addAbs(['cfl','cro','cla']); addAbs(['cla','csw','cro','cfl','cae','car']);
  w.abs=abs;
  // coach rule: holds, carries and conditioning are always timed (set in the library).
  // In Volume weeks, light core and shoulder-health moves also go by time to build endurance.
  if(phi===2){
    const conv=(e,isAbs)=>{
      const ex=exById(e.id); if(!ex||e.fin||e.secs||ex.l) return;
      const core=ex.pat.some(q=>/^c(ae|ar|fl|ro|la|sw)$/.test(q));
      const light=ex.pat.includes('shoulder')||(ex.pat.includes('glute')&&ex.eq.includes('band'));
      if(core||light){e.secs=(isAbs||ex.u)?30:40;e.lo=e.hi=0;if(!isAbs) e.rest=Math.min(e.rest,45)}
    };
    w.main.forEach(e=>conv(e,false)); w.abs.forEach(e=>conv(e,true));
  }
  fit(w,rng,all,used,focus,phi,wf);
  return w;
}

function fit(w,rng,all,used,focus,phi,wf){
  const T=S.target||45; let added=false;
  for(let k=0;k<14;k++){
    const m=estimate(w);
    if(m>T+2){
      const cand=w.main.filter(e=>!e.fin&&e.sets>2&&e.grp!=='C'&&!(w.format==='superset')).sort((a,b)=>b.sets-a.sets)[0];
      if(cand){cand.sets--;continue}
      const gcand=w.main.filter(e=>!e.fin&&e.sets>2).sort((a,b)=>b.sets-a.sets)[0];
      if(gcand){
        if(w.format==='circuit') w.main.forEach(e=>{if(!e.fin&&e.sets>2) e.sets--});
        else if(gcand.grp){const g=w.main.filter(x=>x.grp===gcand.grp);g.forEach(x=>{if(x.sets>2)x.sets--})}
        else gcand.sets--;
        continue}
      const idx=w.main.map((e,i)=>e.fin?-1:i).filter(i=>i>=0).pop();
      if(w.main.filter(e=>!e.fin).length>4&&idx>=0&&!w.main[idx].grp){w.main.splice(idx,1);continue}
      break;
    } else if(m<T-2){
      const cap=w.format==='circuit'?5:4;
      const upCand=w.main.filter(e=>!e.fin&&e.sets<cap).sort((a,b)=>a.sets-b.sets)[0];
      if(upCand){
        if(w.format==='circuit') w.main.forEach(e=>{if(!e.fin&&e.sets<cap) e.sets++});
        else if(upCand.grp){w.main.filter(x=>x.grp===upCand.grp).forEach(x=>{if(x.sets<cap)x.sets++})}
        else upCand.sets++;
        continue}
      if(!added&&w.format!=='circuit'){
        const x=weightedPick(all.filter(y=>!used.has(y.id)&&y.pat.some(p=>EXTRA[focus].includes(p))),wf,rng);
        if(x){used.add(x.id);const e=mk(x);e.sets=Math.min(x.sets,3);e.slot=x.pat[0];
          const fi=w.main.findIndex(z=>z.fin); if(fi>=0) w.main.splice(fi,0,e); else w.main.push(e);
          added=true;continue}
      }
      break;
    } else break;
  }
  if(w.format==='circuit'){const r=Math.max(...w.main.filter(e=>!e.fin).map(e=>e.sets));w.main.forEach(e=>{if(!e.fin) e.sets=r})}
  w.min=estimate(w);
}

const sigIds=w=>new Set([...w.main,...w.abs].map(e=>e.id));
function jacc(a,b){let i=0;a.forEach(x=>{if(b.has(x)) i++});return i/(a.size+b.size-i)}
function maxSim(w,hist){
  const sig=sigIds(w);
  const same=hist.filter(h=>h.focus===w.focus).slice(-14), recent=hist.slice(-6);
  let m=0; new Set([...same,...recent]).forEach(h=>{m=Math.max(m,jacc(sig,sigIds(h)))});
  const exact=hist.some(h=>{const s=sigIds(h);const t=sigIds(w);return s.size===t.size&&jacc(s,t)===1});
  return exact?1:m;
}

function genWorkout(wk,di,focus,phi,regen,hist){
  let best=null,last=null;
  for(let at=0;at<48;at++){
    const rng=mulberry(hash([wk,di,focus,regen,at].join('|')));
    const w=build(rng,focus,phi,hist);
    last=w;
    const sim=maxSim(w,hist);
    if(sim===1) continue;
    w.sim=sim;
    if(!best||sim<best.sim) best=w;
    if(sim<=0.34) break;
  }
  const w=best||last; w.id=wk+'#'+di; w.wk=wk; w.di=di; return w;
}

function genWeek(wk){
  if(!S.start) S.start=wk;
  const idx=weeksBetween(S.start,wk);
  const ph=((idx%4)+4)%4;
  const base=['pull','legs','push','full'];
  const rot=((idx%4)+4)%4;
  const order=base.map((_,i)=>base[(i+rot)%4]);
  const workouts=[];
  const hist=Object.keys(S.weeks).filter(k=>k<wk).sort().flatMap(k=>S.weeks[k].workouts);
  order.forEach((f,i)=>{workouts.push(genWorkout(wk,i,f,ph,S.regen[wk+'#'+i]||0,hist.concat(workouts)))});
  S.weeks[wk]={ph,order,workouts};
}
function ensureWeek(wk){
  if(S.weeks[wk]) return;
  if(!S.start){genWeek(wk);save();return}
  // fill every week from the last generated one up to wk, so history stays in order
  const keys=Object.keys(S.weeks).sort(); let cur=keys.length?keys[keys.length-1]:S.start;
  if(wk<cur){genWeek(wk);save();return}
  let guard=0;
  while(cur<wk&&guard++<26){cur=iso(addDays(parse(cur),7)); if(!S.weeks[cur]) genWeek(cur)}
  save();
}
function getWorkout(wk,di){ensureWeek(wk);return S.weeks[wk].workouts[di]}

function regenDay(wk,di){
  const id=wk+'#'+di; S.regen[id]=(S.regen[id]||0)+1;
  const wkObj=S.weeks[wk]; const old=wkObj.workouts[di];
  const hist=Object.keys(S.weeks).filter(k=>k<wk).sort().flatMap(k=>S.weeks[k].workouts)
    .concat(wkObj.workouts.filter((_,i)=>i!==di));
  const w=genWorkout(wk,di,old.focus,wkObj.ph,S.regen[id],hist);
  wkObj.workouts[di]=w; save();
}
function regenWeek(wk){
  for(let i=0;i<4;i++){const id=wk+'#'+i;S.regen[id]=(S.regen[id]||0)+1}
  delete S.weeks[wk]; const later=Object.keys(S.weeks).filter(k=>k>wk);
  later.forEach(k=>delete S.weeks[k]);
  genWeek(wk); save();
}

function altOptions(w,block,i){
  const list=block==='abs'?w.abs:w.main; const e=list[i]; const cur=exById(e.id);
  const used=new Set([...w.main,...w.abs].map(x=>x.id));
  const ok=x=>available(x)&&!used.has(x.id);
  let same,related=[];
  if(block==='abs'){
    const pt=cur.pat.find(p=>/^c/.test(p));
    same=lib().filter(x=>ok(x)&&x.pat.includes(pt));
    related=lib().filter(x=>ok(x)&&x.pat.some(p=>/^c/.test(p))&&!x.pat.includes(pt));
  } else {
    let slot=e.slot||cur.pat[0];
    if(!lib().some(x=>x.pat.some(p=>slot.split(':')[0].split('/').includes(p)))) slot=cur.pat[0];
    const pats=slot.split(':')[0].split('/'); const f=slot.split(':')[1];
    same=lib().filter(x=>ok(x)&&x.pat.some(p=>pats.includes(p))&&(!f||x.f.includes(f)));
    const rel=new Set(); pats.forEach(p=>(RELATED[p]||[]).forEach(r=>rel.add(r)));
    related=lib().filter(x=>ok(x)&&!same.includes(x)&&x.pat.some(p=>rel.has(p))&&!x.pat.includes('comp')&&!x.pat.includes('warm'));
  }
  const fv=x=>(S.fav||[]).includes(x.id)?0:1; same.sort((a,b)=>fv(a)-fv(b)); related.sort((a,b)=>fv(a)-fv(b));
  return {same,related};
}
function swapEntry(w,idx,blockName,exId){
  const list=blockName==='abs'?w.abs:w.main; const e=list[idx];
  const {same,related}=altOptions(w,blockName,idx);
  let x=exId?exById(exId):null;
  if(!x){
    if(!same.length) return false;
    const rng=mulberry(hash(w.id+idx+Date.now())); x=same[Math.floor(rng()*same.length)];
  }
  const n=mk(x); n.slot=e.slot; if(e.fin) n.fin=1; n.grp=e.grp; n.lab=e.lab;
  if(blockName!=='abs') applyPhase(n,x,w.phase,idx);
  if(w.format==='circuit'&&n.grp==='C') n.sets=e.sets;
  list[idx]=n; w.min=estimate(w); save(); return true;
}

/* ---------- Sessions & suggestions ---------- */
function sess(wid){return S.sessions[wid]||(S.sessions[wid]={date:iso(new Date()),sets:{},done:null})}
function exSessions(exId){
  const out=[];
  Object.entries(S.sessions).forEach(([wid,s])=>{
    const rows=(s.sets[exId]||[]).filter(r=>r&&r.r!==''&&r.r!=null);
    if(rows.length) out.push({wid,date:s.date,rows});
  });
  return out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.wid<b.wid?-1:1);
}
function lastBefore(exId,wid,timed){
  const nat=!!(exById(exId)&&exById(exId).secs);
  const all=exSessions(exId).filter(s=>s.wid!==wid).filter(s=>{
    const r=s.rows[0]; const tm=r.t===undefined?nat:!!r.t; return tm===!!timed});
  return all.length?all[all.length-1]:null;
}
function suggest(ex,e,prev){
  if(!prev) return null;
  const fr=flat(prev.rows); const ws=fr.map(r=>+r.w||0), rs=fr.map(r=>+r.r||0);
  const top=Math.max(...ws);
  const inc=isCable(ex)?1:ex.pat.some(p=>['squat','hinge','glute','comp','single'].includes(p))?5:2.5;
  if(e.secs){const t=Math.max(...rs);return {text:'Beat '+t+' sec: aim for '+(t+5)+' sec.',w:top||'',r:t+5}}
  const hitTop=rs.length>=Math.min(e.sets,prev.rows.length)&&rs.every(r=>r>=e.hi);
  if(top>0){
    if(hitTop) return {text:'You hit the top of the range. Try '+(top+inc)+' '+wu(ex)+'.',w:top+inc,r:e.lo};
    return {text:'Stay at '+top+' '+wu(ex)+' and add a rep or two.',w:top,r:Math.min(e.hi,Math.max(...rs)+1)};
  }
  const best=Math.max(...rs); return {text:'Beat '+best+' reps.',w:'',r:best+1};
}
const hasL=r=>r&&r.lr!==undefined&&r.lr!==''&&r.lr!==null;
const flat=rows=>rows.flatMap(r=>hasL(r)?[r,{w:r.lw,r:r.lr,t:r.t}]:[r]);
const one=(w,r)=>((w!==''&&w!=null)?w+'×':'')+(r||'?');
const isCable=ex=>!!ex&&ex.eq.includes('cable');
const wu=ex=>isCable(ex)?'plates':'lb';
const fmtRows=rows=>rows.map(r=>hasL(r)?one(r.w,r.r)+' R, '+one(r.lw,r.lr)+' L':one(r.w,r.r)).join(', ');

/* ---------- UI state ---------- */
const U={tab:'workout',wk:iso(mondayOf(new Date())),day:0,sel:null,metric:'top',swap:null,edit:null,cal:0};
function sortedDays(){return [...S.days].sort((a,b)=>((a+6)%7)-((b+6)%7))}
function dayDate(wk,di){return addDays(parse(wk),(sortedDays()[di]+6)%7)}

/* ---------- Render ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),1800)}

function renderNav(){
  const items=[['workout','Workout','#/'],['progress','Progress','#/progress'],['settings','Gear & settings','#/settings']];
  const nav=$('#nav'); nav.style.display='';
  nav.innerHTML=items.map(([k,l,h])=>`<a href="${h}" ${(U.tab===k||(U.tab==='day'&&k==='workout'))?'aria-current="page"':''}>${l}</a>`).join('');
}
function repText(e){return e.secs?e.secs+' sec':(e.lo===e.hi?e.lo:e.lo+'–'+e.hi)+' reps'}
function presc(e){return `${e.sets} × ${repText(e)}`}

function targetReps(e,sg){
  if(e.secs) return e.secs;
  if(sg&&sg.r) return Math.min(e.hi,Math.max(e.lo,sg.r));
  return Math.round((e.lo+e.hi)/2);
}
function adjustPanel(w,e,ex,block,i){
  const ed=U.edit; if(!ed||ed.b!==block||ed.i!==i) return '';
  const mode=ed.mode;
  return `<div class="adjust">
    <div class="row"><label>Sets <input type="number" id="adj-sets" min="1" max="8" value="${ed.sets||e.sets}"></label></div>
    <div class="row">${mode==='time'
      ?`<label>Seconds <input type="number" id="adj-secs" min="10" max="300" step="5" value="${e.secs||40}"></label>${ex.u?'<span class="note">for each side</span>':''}`
      :`<label>Reps <input type="number" id="adj-lo" min="1" max="60" value="${e.lo||8}"> to <input type="number" id="adj-hi" min="1" max="60" value="${e.hi||12}"></label>`}</div>
    <div class="row"><button class="btn primary small" data-act="applyadj">Save</button><button class="btn small" data-act="canceladj">Cancel</button></div></div>`;
}
function coachNote(ex){
  if(ex.pat.includes('carry')) return 'Coach: go by the clock. Walk tall with steady steps and put the weights down if your grip or posture slips.';
  if(ex.pat.includes('cardio')) return 'Coach: go by the clock. Work hard for the time, then rest. No jumping.';
  if(ex.pat.some(q=>/^c(ae|ar|la|sw)$/.test(q))) return 'Coach: hold or work for time here. Keep your position strong the whole way and stop early if your form slips.';
  if(ex.pat.includes('shoulder')) return 'Coach: go by the clock here. Light weight, slow and controlled, and keep your shoulder blades steady.';
  return 'Coach: go by the clock here. Steady, controlled work for the full time.';
}
function exCard(w,e,i,block){
  const ex=exById(e.id); if(!ex) return '';
  const wid=w.id; const timed=!!e.secs;
  const prev=lastBefore(e.id,wid,timed); const sg=suggest(ex,e,prev);
  const tgt=targetReps(e,sg);
  const s=S.sessions[wid]; const saved=(s&&s.sets[e.id])||[];
  const showW=!!ex.l;
  const unit=timed?'seconds':'reps';
  let rows='';
  for(let n=0;n<e.sets;n++){
    const r=saved[n]||{};
    const side=(sd)=>{
      const kw=sd==='L'?'lw':'w', kr=sd==='L'?'lr':'r', lab=sd?`Set ${n+1} ${sd}`:`Set ${n+1}`, al=sd?` ${sd==='L'?'left':'right'} side`:'';
      let wv=r[kw], pre=false;
      if(showW&&(wv===undefined||wv===''||wv===null)){
        wv='';
        if(prev&&prev.rows.length){const pr=prev.rows[n]||prev.rows[prev.rows.length-1]; const pv=sd==='L'?(hasL(pr)?pr.lw:pr.w):pr.w; if(pv!==''&&pv!=null){wv=pv;pre=true}}
      }
      const on=r[kr]!==undefined&&r[kr]!==''&&r[kr]!==null;
      return `<span class="sl">${lab}</span>`+
        (showW?`<input inputmode="decimal" aria-label="Set ${n+1}${al} weight in ${isCable(ex)?'plates':'pounds'}" data-set="${block}|${i}|${n}|${kw}" class="${pre?'pre':''}" value="${wv??''}" placeholder="${isCable(ex)?'plates':'lb'}">`:'')+
        `<input inputmode="numeric" aria-label="Set ${n+1}${al} ${unit}" data-set="${block}|${i}|${n}|${kr}" data-target="${tgt}" value="${r[kr]??''}" placeholder="${tgt}">`+
        `<button class="ck ${on?'on':''}" data-act="setdone" data-set="${block}|${i}|${n}|${kr}" aria-pressed="${on}" aria-label="Log set ${n+1}${al} as shown">✓</button>`;
    };
    rows+=ex.u?side('R')+side('L'):side('');
  }
  const tags=ex.eq.filter(x=>x!=='none').map(x=>GEAR_NAME[x.split('/')[0]]+(x.includes('/')?' or '+GEAR_NAME[x.split('/')[1]]:'')).concat(ex.u?['One side at a time']:[]);
  const grp=e.lab?`<span class="grp">${e.lab}</span>`:'';
  const steps=HOWTO[e.id]||['Use controlled reps in a pain-free range.','Stop a set if your form breaks down.'];
  const yt='https://www.youtube.com/results?search_query='+encodeURIComponent(ex.n+' exercise form');
  const musc=muscOf(ex);
  const aim=timed?`Aim for ${e.secs} seconds${ex.u?' each side':''} per set.`:`Aim for ${tgt} reps per set${ex.u?' on each side':''}. Your range is ${e.lo}–${e.hi}.`;

function weekBalance(wk){
  let pull=0,push=0;
  S.weeks[wk].workouts.forEach(w=>w.main.forEach(e=>{
    const ex=exById(e.id); if(!ex) return;
    if(ex.pat.some(p=>['vpull','hpull'].includes(p))||(ex.f.includes('pull')&&ex.pat.includes('comp'))) pull+=e.sets;
    if(ex.pat.some(p=>['hpush','vpush','tri'].includes(p))) push+=e.sets;
  }));
  return {pull,push};
}

/* Progress */
function chartSvg(pts,yl){
  if(!pts.length) return '<p class="empty">No data for this yet.</p>';
  const W=640,H=250,pl=48,pr=16,pt=16,pb=34;
  const ys=pts.map(p=>p.v); let lo=Math.min(...ys),hi=Math.max(...ys);
  if(lo===hi){lo=Math.max(0,lo-1);hi=hi+1}
  const pad=(hi-lo)*0.12; lo=Math.max(0,lo-pad); hi=hi+pad;
  const t0=parse(pts[0].d).getTime(),t1=parse(pts[pts.length-1].d).getTime();
  const X=p=>pl+(t1===t0?(W-pl-pr)/2:(parse(p.d).getTime()-t0)/(t1-t0)*(W-pl-pr));
  const Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
  const line=pts.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
  const ticks=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${Y(v)+4}" text-anchor="end">${Math.round(v*10)/10}</text>`).join('');
  const dots=pts.map(p=>`<circle cx="${X(p).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="5" fill="var(--buoy)"><title>${p.d}: ${p.v} ${yl}</title></circle>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(yl)} over time, ${pts.length} sessions">
    ${ticks}<path d="${line}" fill="none" stroke="var(--lane)" stroke-width="3" stroke-linejoin="round"/>${dots}
    <text x="${pl}" y="${H-10}">${pts[0].d}</text><text x="${W-pr}" y="${H-10}" text-anchor="end">${pts[pts.length-1].d}</text></svg>`;
}
function calendarCard(){
  const days={};
  Object.values(S.sessions).forEach(s=>{
    const logged=Object.values(s.sets||{}).some(a=>a.some(r=>r&&r.r!==''&&r.r!=null));
    if(!s.date||!(s.done||logged)) return;
    days[s.date]=days[s.date]==='done'||s.done?'done':'part';
  });
  const now=new Date(); const m0=new Date(now.getFullYear(),now.getMonth()+U.cal,1);
  const y=m0.getFullYear(), mo=m0.getMonth(); const dim=new Date(y,mo+1,0).getDate(); const lead=m0.getDay();
  const today=iso(now); let cells='';
  for(let i=0;i<lead;i++) cells+='<span class="cd"></span>';
  let n=0;
  for(let d=1;d<=dim;d++){
    const k=y+'-'+pad(mo+1)+'-'+pad(d); const st=days[k]; if(st==='done') n++;
    cells+=`<span class="cd ${st==='done'?'on':st==='part'?'part':''} ${k===today?'today':''}" ${st?`aria-label="${k}: lifted"`:''}>${d}</span>`;
  }
  const label=m0.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  return `<div class="card cal"><div class="calhead"><button class="btn small" data-act="calnav" data-d="-1" aria-label="Previous month">←</button><h3>${label}</h3>
    <button class="btn small" data-act="calnav" data-d="1" aria-label="Next month" ${U.cal>=0?'disabled':''}>→</button></div>
    <div class="calgrid">${['S','M','T','W','T','F','S'].map(x=>`<span class="cw">${x}</span>`).join('')}${cells}</div>
    <p class="note">${n} ${n===1?'day':'days'} lifted this month. Filled = finished workout, outlined = sets logged but not finished.</p></div>`;
}
function renderProgress(){
  const sessions=Object.values(S.sessions).filter(s=>s.done);
  const doneIds=Object.keys(S.sessions).filter(k=>S.sessions[k].done);
  const weeks=new Set(doneIds.map(k=>k.split('#')[0]));
  // streak: consecutive weeks (ending this/last week) with at least 3 finished workouts
  let streak=0; let cur=parse(iso(mondayOf(new Date())));
  const cnt=wk=>doneIds.filter(k=>k.startsWith(wk+'#')).length;
  if(cnt(iso(cur))<3) cur=addDays(cur,-7);
  while(cnt(iso(cur))>=3){streak++;cur=addDays(cur,-7)}
  const exIds=[...new Set(Object.values(S.sessions).flatMap(s=>Object.keys(s.sets)))].filter(id=>exSessions(id).length&&exById(id));
  exIds.sort((a,b)=>exById(a).n.localeCompare(exById(b).n));
  if(!U.sel||!exIds.includes(U.sel)) U.sel=exIds[0]||null;
  let body='';
  if(!U.sel) body='<p class="empty">Log a few sets on the Workout tab and your charts show up here.</p>';
  else{
    const ex=exById(U.sel); const ss=exSessions(U.sel);
    const pts=ss.map(s=>{
      const fr=flat(s.rows); const ws=fr.map(r=>+r.w||0), rs=fr.map(r=>+r.r||0);
      const v=U.metric==='top'?Math.max(...ws):U.metric==='vol'?fr.reduce((a,r)=>a+(+r.w||0)*(+r.r||0),0):Math.max(...rs);
      return {d:s.date,v};
    });
    const unitLbl=U.metric==='top'?wu(ex):U.metric==='vol'?wu(ex)+' total (weight × reps)':(ex.secs?'sec':'reps');
    body=`<div class="row"><select id="exsel" aria-label="Exercise">${exIds.map(id=>`<option value="${id}" ${id===U.sel?'selected':''}>${esc(exById(id).n)}</option>`).join('')}</select>

        <button data-act="metric" data-k="top" aria-pressed="${U.metric==='top'}">Top weight</button>
        <button data-act="metric" data-k="vol" aria-pressed="${U.metric==='vol'}">Total volume</button>
        <button data-act="metric" data-k="reps" aria-pressed="${U.metric==='reps'}">Best reps</button></div></div>
      <p class="note">${unitLbl}</p>${chartSvg(pts,unitLbl)}
      <table><thead><tr><th>Date</th><th>Sets (weight × reps)</th></tr></thead><tbody>
      ${[...ss].reverse().map(s=>`<tr><td>${s.date}</td><td>${fmtRows(s.rows)}</td></tr>`).join('')}</tbody></table>`;
  }
  return `<h2>Progress</h2>
  ${calendarCard()}
  <div class="stats" style="margin-top:12px">
    <div class="stat"><b>${doneIds.length}</b><span>workouts finished</span></div>
    <div class="stat"><b>${weeks.size}</b><span>weeks trained</span></div>
    <div class="stat"><b>${streak}</b><span>week streak (3+ workouts)</span></div></div>
  <div class="card"><h3>Exercise history</h3>${body}</div>`;
}

let RT=null;
function stopRest(){ if(RT){clearInterval(RT.t); RT=null} const r=document.getElementById('rest'); if(r) r.remove() }
function startRest(secs,label){
  stopRest(); closeTimer();
  try{ const C=window.AudioContext||window.webkitAudioContext; if(C){audioCtx=audioCtx||new C(); if(audioCtx.state==='suspended') audioCtx.resume()} }catch(e){}
  const el=document.createElement('div'); el.id='rest'; el.setAttribute('role','status');
  el.innerHTML=`<div class="rinfo"><span class="rl">Rest</span><b class="rn">${secs}</b><span class="rs">sec</span></div><div class="rbtns"><button class="btn small" id="rplus">+15</button><button class="btn small teal" id="rskip">Skip</button></div>`;
  document.body.appendChild(el);
  RT={end:Date.now()+secs*1000,t:null,dinged:false,done:false};
  const n=el.querySelector('.rn'), l=el.querySelector('.rl');
  const tick=()=>{ if(!RT) return;
    const left=Math.max(0,Math.ceil((RT.end-Date.now())/1000)); n.textContent=left;
    el.classList.toggle('low',left<=10&&left>0);
    if(left<=10&&left>0&&!RT.dinged&&secs>15){RT.dinged=true;ding(1175,400,0.3)}
    if(left<=0&&!RT.done){RT.done=true;clearInterval(RT.t);l.textContent='Go!';n.textContent='';el.classList.add('fin');ding(880,250,0.35);setTimeout(()=>ding(1320,500,0.4),300);haptic('go'); setTimeout(()=>{if(RT&&RT.done)stopRest()},4000)}
  };
  el.querySelector('#rskip').onclick=stopRest;
  el.querySelector('#rplus').onclick=()=>{ if(!RT) return; if(RT.done){RT.done=false;RT.dinged=true;l.textContent='Rest';el.classList.remove('fin');RT.end=Date.now()+15000;RT.t=setInterval(tick,250)} else RT.end+=15000; tick() };
  tick(); RT.t=setInterval(tick,250);
}
function afterSet(btn){
  const [block,i,n,k]=btn.dataset.set.split('|'); const art=btn.closest('article.ex'); if(!art) return;
  let target=[...art.querySelectorAll('button.ck')].find(x=>!x.classList.contains('on'));
  let atEnd=false;
  if(!target){ const arts=[...document.querySelectorAll('article.ex')]; const nx=arts[arts.indexOf(art)+1];
    if(nx) target=nx.querySelector('button.ck:not(.on)')||nx; else atEnd=true }
  const w=getWorkout(U.wk,U.day); const list=block==='abs'?w.abs:w.main; const e=list[+i]; const ex=e&&exById(e.id);
  if(S.autoRest!==false&&ex&&!e.grp&&(!ex.u||k==='lr')&&!atEnd&&!e.secs) startRest(e.rest||60);
  if(atEnd){ const f=document.querySelector('[data-act="finish"]'); if(f) f.scrollIntoView({behavior:'smooth',block:'center'}); return }
  if(target) setTimeout(()=>target.scrollIntoView({behavior:'smooth',block:'center'}),80);
}
function setWarm(id,on){
  const w=getWorkout(U.wk,U.day); if(!w) return; const se=sess(w.id); se.warm=se.warm||{};
  if(on) se.warm[id]=1; else delete se.warm[id]; save();
  const li=document.querySelector(`li[data-warm="${id}"]`);
  if(li){li.classList.toggle('complete',!!on); const b=li.querySelector('.wck'); if(b){b.classList.toggle('on',!!on); b.setAttribute('aria-pressed',String(!!on))}}
  updateDone();
}
function updateDone(user){
  const cards=[...document.querySelectorAll('article.ex[data-card]')]; if(!cards.length&&!document.querySelector('li[data-warm]')) return;
  let done=0;
  cards.forEach(c=>{const was=c.classList.contains('complete'); const needw=c.dataset.needw==='1'; const ins=[...c.querySelectorAll('input[data-set]')].filter(x=>needw||/\|l?r$/.test(x.dataset.set)); const ok=ins.length>0&&ins.every(x=>x.value.trim()!==''); c.classList.toggle('complete',ok); if(ok) done++; if(user&&ok&&!was) haptic('success')});
  const wl=[...document.querySelectorAll('li[data-warm]')]; wl.forEach(l=>{if(l.classList.contains('complete')) done++});
  const total=cards.length+wl.length; const p=document.getElementById('dprog');
  if(p) p.textContent=total?(done===total?'All '+total+' done. Tap Finish workout below.':done+' of '+total+' done'):'';
}
function render(keep){
  const y=window.scrollY;
  renderNav();
  $('#app').innerHTML=U.tab==='day'?renderDay():U.tab==='progress'?renderProgress():U.tab==='settings'?renderSettings():renderHome();
  updateDone();
  if(keep) window.scrollTo(0,y);
}

function route(){
  const h=location.hash.replace(/^#\/?/,'').split('/');
  const okWk=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?iso(mondayOf(parse(v))):null;
  U.swap=null;U.edit=null;
  if(h[0]==='day'&&okWk(h[1])&&/^[0-3]$/.test(h[2]||'')){U.tab='day';U.wk=okWk(h[1]);U.day=+h[2]}
  else if(h[0]==='progress') U.tab='progress';
  else if(h[0]==='settings') U.tab='settings';
  else{U.tab='workout';U.wk=(h[0]==='week'&&okWk(h[1]))||iso(mondayOf(new Date()))}
  if(S.start&&U.wk<S.start) U.wk=S.start;
  ensureWeek(U.wk); render(); window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);

/* ---------- Events ---------- */
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='wk'){
    const n=+b.dataset.n;
    const wk=n===0?iso(mondayOf(new Date())):iso(addDays(parse(U.wk),7*n));
    location.hash=(n===0)?'#/':'#/week/'+(S.start&&wk<S.start?S.start:wk);
    if(n===0&&location.hash==='#/') route();
  }
  else if(a==='finish'){const w=getWorkout(U.wk,U.day);const s=sess(w.id);s.done=s.date||iso(new Date());save();toast('Workout saved');render(true)}
  else if(a==='regen-day'){regenDay(U.wk,U.day);render(true);toast('New version built')}
  else if(a==='regen-week'){regenWeek(U.wk);render(true);toast('Week rebuilt')}
  else if(a==='swap'){
    const w=getWorkout(U.wk,U.day); const o=altOptions(w,b.dataset.b,+b.dataset.i);
    if(!o.same.length&&!o.related.length) return toast('No other option fits your gear');
    U.swap={b:b.dataset.b,i:+b.dataset.i}; render(true);
  }
  else if(a==='warmdone'){const nowOn=!b.classList.contains('on'); haptic(nowOn?'done':'tick'); setWarm(b.dataset.id,nowOn)}
  else if(a==='calnav'){U.cal=Math.min(0,U.cal+(+b.dataset.d));render(true)}
  else if(a==='closesheet'){U.swap=null;render(true)}
  else if(a==='setdone'){
    const ri=document.querySelector(`input[data-set="${b.dataset.set}"]`);
    const on=b.classList.contains('on');
    if(on) ri.value=''; else if(!ri.value) ri.value=ri.dataset.target;
    const wi=document.querySelector(`input[data-set="${b.dataset.set.replace(/r$/,'w')}"]`); if(wi) wi.classList.remove('pre');
    storeSet(ri); b.classList.toggle('on',!on); b.setAttribute('aria-pressed',String(!on)); save(); haptic(on?'tick':'done'); updateDone(true);
    clearTimeout(b._rt); delete b.dataset.pend;
    if(!on) afterSet(b);
  }
  else if(a==='adjust'){
    const w=getWorkout(U.wk,U.day); const list=b.dataset.b==='abs'?w.abs:w.main; const e=list[+b.dataset.i];
    if(U.edit&&U.edit.b===b.dataset.b&&U.edit.i===+b.dataset.i) U.edit=null;
    else U.edit={b:b.dataset.b,i:+b.dataset.i,mode:e.secs?'time':'reps',sets:e.sets};
    render(true);
  }
  else if(a==='mode'){
    if(U.edit){const si=$('#adj-sets'); if(si) U.edit.sets=+si.value||U.edit.sets; U.edit.mode=b.dataset.m; render(true)}
  }
  else if(a==='canceladj'){U.edit=null;render(true)}
  else if(a==='applyadj'){
    const w=getWorkout(U.wk,U.day); const ed=U.edit; if(!ed) return;
    const list=ed.b==='abs'?w.abs:w.main; const e=list[ed.i];
    const cl=(v,lo,hi)=>Math.min(hi,Math.max(lo,v));
    e.sets=cl(+$('#adj-sets').value||e.sets,1,8);
    if(ed.mode==='time'){e.secs=cl(+$('#adj-secs').value||40,10,300);e.lo=e.hi=0}
    else{
      const lo=cl(+$('#adj-lo').value||8,1,60); const hi=Math.max(lo,cl(+$('#adj-hi').value||lo,1,60));
      e.secs=0;e.lo=lo;e.hi=hi;
    }
    w.min=estimate(w); save(); U.edit=null; render(true); toast('Updated');
  }
  else if(a==='timer'){runTimer(b)}
  else if(a==='pick'){
    const w=getWorkout(U.wk,U.day); const sw=U.swap; U.swap=null;
    if(sw&&swapEntry(w,sw.i,sw.b,b.dataset.id)) toast('Swapped');
    render(true);
  }
  else if(a==='hide'){
    const w=getWorkout(U.wk,U.day);const list=b.dataset.b==='abs'?w.abs:w.main;const id=list[+b.dataset.i].id;
    if(!S.avoid.includes(id)) S.avoid.push(id); S.fav=(S.fav||[]).filter(x=>x!==id); save();
    if(!swapEntry(w,+b.dataset.i,b.dataset.b)) toast('Hidden, but nothing else fits this slot');
    render(true);
  }
  else if(a==='fav'){
    S.fav=S.fav||[]; const id=b.dataset.id;
    S.fav=S.fav.includes(id)?S.fav.filter(x=>x!==id):[...S.fav,id]; save();
    toast(S.fav.includes(id)?'Added to favorites. It will show up more in new workouts.':'Removed from favorites'); render(true);
  }
  else if(a==='unhide'){S.avoid=S.avoid.filter(x=>x!==b.dataset.id);save();render(true)}
  else if(a==='metric'){U.metric=b.dataset.k;render(true)}
  else if(a==='addcustom'){
    const n=$('#cn').value.trim(); if(!n) return toast('Give it a name');
    S.custom.push({id:'c_'+Date.now().toString(36),n,pat:$('#cp').value,eq:['none']}); save(); render(true); toast('Added to your library');
  }
  else if(a==='delcustom'){S.custom=S.custom.filter(c=>c.id!==b.dataset.id);save();render(true)}
  else if(a==='refreshapp'){
    toast('Checking for the latest version...');
    const go=()=>location.replace(location.pathname+'?r='+Date.now()+'#/settings');
    try{ if(window.caches&&caches.keys) caches.keys().then(k=>Promise.all(k.map(x=>caches.delete(x)))).then(()=>setTimeout(go,300),()=>setTimeout(go,300)); else setTimeout(go,300) }catch(e){ setTimeout(go,300) }
  }
  else if(a==='export'){
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='swimlift-backup-'+iso(new Date())+'.json';l.click();
    setTimeout(()=>URL.revokeObjectURL(l.href),1000);
  }
  else if(a==='reset'){if(confirm('Erase all workouts and logs on this device? Export a backup first if you want to keep them.')){S=DEFAULTS();save();location.hash='#/';route()}}
});
let audioCtx=null;
function unlockAudio(){
  try{ if(navigator.audioSession){ const t=S.sound==='loud'?'playback':'ambient'; if(navigator.audioSession.type!==t) navigator.audioSession.type=t } }catch(e){} // ambient mixes with an audiobook; playback plays over everything
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    audioCtx=audioCtx||new C(); if(audioCtx.state==='suspended') audioCtx.resume();
    const b=audioCtx.createBuffer(1,1,22050), src=audioCtx.createBufferSource(); src.buffer=b; src.connect(audioCtx.destination); src.start(0);
  }catch(e){}
}
['pointerdown','touchstart','click','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
let hapEl=null, hapLast=0;
function haptic(kind){
  if(S.haptics===false) return;
  const now=Date.now(); if(kind==='tick'&&now-hapLast<60) return; hapLast=now;
  try{ if(navigator.vibrate){ navigator.vibrate(kind==='success'?[30,50,30,50,60]:kind==='done'?[25,45,25]:kind==='go'?[60,60,60]:12); return } }catch(e){}
  try{ // iPhone Safari has no vibrate; a hidden switch control gives a tap when toggled
    if(!hapEl){ hapEl=document.createElement('label'); hapEl.setAttribute('aria-hidden','true'); hapEl.style.cssText='position:fixed;left:-200px;top:0;opacity:0;pointer-events:none';
      const i=document.createElement('input'); i.type='checkbox'; i.setAttribute('switch',''); i.tabIndex=-1; hapEl.appendChild(i); document.body.appendChild(hapEl) }
    const pulse=()=>hapEl.click();
    pulse();
    if(kind==='done'){ setTimeout(pulse,80) }
    else if(kind==='success'){ setTimeout(pulse,80); setTimeout(pulse,170); setTimeout(pulse,280) }
    else if(kind==='go'){ setTimeout(pulse,90); setTimeout(pulse,180) }
  }catch(e){}
}
function ding(f,ms,vol){
  if(S.sound==='off') return;
  try{ if(audioCtx){
    const gain=Math.min(1,(vol||0.3)*(S.sound==='loud'?3:2.4));
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='triangle';o.connect(g);g.connect(audioCtx.destination);o.frequency.value=f;
    g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+ms/1000);
    o.start();setTimeout(()=>{try{o.stop()}catch(e){}},ms+30)} }catch(e){}
}
function beep(){
  ding(880,350);setTimeout(()=>ding(880,350),450);setTimeout(()=>ding(1175,700),900);
  haptic('success');
}
let TM=null;
function closeTimer(){
  if(!TM) return; clearInterval(TM.t); try{TM.wl&&TM.wl.release()}catch(e){}
  const el=document.getElementById('tmr'); if(el) el.remove(); TM=null;
}
function runTimer(btn){
  closeTimer(); stopRest();
  try{ const C=window.AudioContext||window.webkitAudioContext; if(C){audioCtx=audioCtx||new C(); if(audioCtx.state==='suspended') audioCtx.resume()} }catch(e){}
  const total=+btn.dataset.secs||30, READY=5;
  const host=btn.closest('article.ex,li'); const nm=host&&host.querySelector('h3,.wh b'); const name=nm?nm.textContent:'Timer';
  const R=88, C2=2*Math.PI*R;
  const el=document.createElement('div'); el.id='tmr'; el.className='ready'; el.setAttribute('role','dialog'); el.setAttribute('aria-modal','true'); el.setAttribute('aria-label','Timer');
  el.innerHTML=`<div class="tbox"><p class="tname">${esc(name)}</p>
    <div class="tring"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="tbg" cx="100" cy="100" r="${R}"/><circle class="tfg" cx="100" cy="100" r="${R}" stroke-dasharray="${C2}" stroke-dashoffset="0" transform="rotate(-90 100 100)"/></svg>
    <div class="tnum" aria-live="off">${READY}</div></div>
    <p class="tsub">Get ready</p>
    <div class="trow"><button class="btn teal" id="tpause">Pause</button><button class="btn" id="tclose">Close</button></div></div>`;
  document.body.appendChild(el);
  TM={phase:'ready',end:Date.now()+READY*1000,left:READY,last:READY+1,paused:false,dinged:false,done:false,t:null,wl:null};
  try{ if(navigator.wakeLock) navigator.wakeLock.request('screen').then(w=>{TM?TM.wl=w:w.release()}).catch(()=>{}) }catch(e){}
  const num=el.querySelector('.tnum'), fg=el.querySelector('.tfg'), sub=el.querySelector('.tsub'), pb=el.querySelector('#tpause');
  const paint=(left,max)=>{ num.textContent=left; fg.style.strokeDashoffset=String(C2*(1-left/max)); el.classList.toggle('low',TM.phase==='run'&&left<=10&&left>0) };
  const tick=()=>{
    if(!TM||TM.paused||TM.done) return;
    const left=Math.max(0,Math.ceil((TM.end-Date.now())/1000)); TM.left=left;
    if(TM.phase==='ready'){
      if(left>0){ if(left!==TM.last){TM.last=left;ding(660,160,0.3)} paint(left,READY); return }
      TM.phase='run'; TM.end=Date.now()+total*1000; TM.left=total; TM.dinged=false;
      el.classList.remove('ready'); sub.textContent='seconds left'; paint(total,total); ding(1320,700,0.4);
      haptic('go');
      return;
    }
    paint(left,total);
    if(left<=10&&left>0&&!TM.dinged&&total>10){TM.dinged=true;ding(1175,500,0.35)}
    if(left<=0){TM.done=true;clearInterval(TM.t);num.textContent='Done';fg.style.strokeDashoffset=String(C2);el.classList.remove('low');el.classList.add('fin');sub.textContent='Nice work';pb.textContent='Again';beep();
      if(btn.dataset.warm) setWarm(btn.dataset.warm,true)}
  };
  pb.onclick=()=>{
    if(TM.done){closeTimer();runTimer(btn);return}
    if(TM.paused){TM.paused=false;TM.end=Date.now()+TM.left*1000;pb.textContent='Pause';sub.textContent=TM.phase==='ready'?'Get ready':'seconds left'}
    else{TM.paused=true;pb.textContent='Resume';sub.textContent='paused'}
  };
  el.querySelector('#tclose').onclick=closeTimer;
  tick(); TM.t=setInterval(tick,200);
}
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&U.swap){U.swap=null;render(true)}});
function storeSet(t){
  const [block,i,n,k]=t.dataset.set.split('|'); const w=getWorkout(U.wk,U.day);
  const e=(block==='abs'?w.abs:w.main)[+i]; const s=sess(w.id);
  const arr=s.sets[e.id]||(s.sets[e.id]=[]); const row=arr[+n]||(arr[+n]={w:'',r:''});
  row[k]=t.value.replace(',','.'); row.t=e.secs?1:0;
  if(k==='r'||k==='lr'){ // typing reps also records the weight shown in that row, even if it was prefilled
    const wk=k==='r'?'w':'lw'; const wi=document.querySelector(`input[data-set="${block}|${i}|${n}|${wk}"]`); if(wi) row[wk]=wi.value.replace(',','.');
  }
  for(let j=0;j<arr.length;j++) if(!arr[j]) arr[j]={w:'',r:''};
}
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset&&t.dataset.set){
    t.classList.remove('pre'); storeSet(t); haptic('tick');
    if(/\|l?r$/.test(t.dataset.set)){
      const ck=document.querySelector(`[data-act="setdone"][data-set="${t.dataset.set}"]`);
      if(ck){
        const wasOn=ck.classList.contains('on'); const on=t.value!==''; ck.classList.toggle('on',on); ck.setAttribute('aria-pressed',String(on)); if(on&&!wasOn) haptic('done');
        // finished typing reps for a new set: start rest and move on after a short pause
        if(!on){ clearTimeout(ck._rt); delete ck.dataset.pend }
        else if(!wasOn||ck.dataset.pend){
          ck.dataset.pend='1'; clearTimeout(ck._rt);
          ck._rt=setTimeout(()=>{ delete ck.dataset.pend; if(t.value!==''&&ck.classList.contains('on')){ try{t.blur()}catch(e){} afterSet(ck) } },1400);
        }
      }
    }
    updateDone(true);
    clearTimeout(window.__sv); window.__sv=setTimeout(save,250);
  }
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='exsel'){U.sel=t.value;render(true)}
  else if(t.dataset.gear){S.gear[t.dataset.gear]=t.checked;save()}
  else if(t.id==='knee'){S.knee=+t.value;save()}
  else if(t.id==='sound'){S.sound=t.value;save();unlockAudio();ding(1175,500,0.4);setTimeout(()=>ding(1320,500,0.4),350)}
  else if(t.id==='haptics'){S.haptics=t.checked;save(); if(t.checked) haptic('done')}
  else if(t.id==='autorest'){S.autoRest=t.checked;save(); if(!t.checked) stopRest()}
  else if(t.id==='wdate'){
    if(!t.value) return;
    const w=getWorkout(U.wk,U.day); const se=sess(w.id); se.date=t.value; if(se.done) se.done=t.value;
    save(); toast('Date updated'); render(true);
  }
  else if(t.id==='tgt'){S.target=Math.min(90,Math.max(25,+t.value||45));save()}
  else if(t.dataset.day!==undefined){
    const vals=[...document.querySelectorAll('[data-day]')].map(s=>+s.value);
    if(new Set(vals).size<4){toast('Pick four different days');render(true);return}
    S.days=vals; save(); toast('Days updated');
  }
  else if(t.id==='imp'&&t.files[0]){
    const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result); if(!d||!d.sessions||!d.weeks) throw 0; S=Object.assign(DEFAULTS(),d); save(); render(true); toast('Backup restored')}catch(e){toast('That file is not a SwimLift backup')}};
    r.readAsText(t.files[0]);
  }
});

/* ---------- Boot ---------- */
route();
window.SL={S:()=>S,lib,genWeek,ensureWeek,estimate,exById,available,regenDay,FOCUS,altOptions,HOWTO,MUSC,route,U,setTarget:v=>{S.target=v},setKnee:v=>{S.knee=v},reset:()=>{S=DEFAULTS()},getWeeks:()=>S.weeks,jacc,sigIds};
})();
